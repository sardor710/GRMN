es.garmin.com/en/products/010-04598-00/v/pd-04-lg.jpg"},{"altTag":"Edge® 1060 7","caption":null,"image":"https://res.garmin.com/en/products/010-04598-00/v/pd-05-lg.jpg"}],"mediaGallery":[{"publicId":"Product_Images/en/products/010-04598-00/v/cf-xl","mediaType":"image","format":"jpg","position":"0"},{"publicId":"Product_Images/en/products/010-04598-00/v/rf-xl","mediaType":"image","format":"jpg","position":"1"},{"publicId":"Product_Images/en/products/010-04598-00/v/lf-xl","mediaType":"image","format":"jpg","position":"2"},{"publicId":"Product_Images/en/products/010-04598-00/v/pd-01-xl","mediaType":"image","format":"jpg","position":"3"},{"publicId":"Product_Images/en/products/010-04598-00/v/pd-02-xl","mediaType":"image","format":"jpg","position":"4"},{"publicId":"Product_Images/en/products/010-04598-00/v/pd-03-xl","mediaType":"image","format":"jpg","position":"5"},{"publicId":"Product_Images/en/products/010-04598-00/v/pd-04-xl","mediaType":"image","format":"jpg","position":"6"},{"publicId":"Product_Images/en/products/010-04598-00/v/pd-05-xl","mediaType":"image","format":"jpg","position":"7"}],"valid":true},"options":{"selected":{"version":["Edge® 1060"]},"enabled":null,"disabled":null},"actions":{"buy":{"href":"https://buy.garmin.com/en-US/cart/addToCart?partNumQty=010-04598-00:1","text":"Add To Cart"}},"productHeaderDetails":null,"sidebar":{"quickLinks":{"display":true,"showSoftware":true,"showFAQ":true,"softwareLink":"https://support.garmin.com/?tab=software&partNumber=010-04598-00","content":null},"additionalContainer":null},"tabs":{"overviewTab":{"title":"Overview","content":"<div><!-- keep this to ensure overview section goes to full width layout -->\r\n<overview-container/>\r\n\r\n<!-- start video-banner -->\r\n<pc-video-banner\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04598-00/g/87255-D-VID.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04598-00/g/87255-M-VID.jpg\"\r\n  img-alt=\"\"\r\n  video-title=\"\"\r\n  video-link=\"https://www.youtube-nocookie.com/embed/NJv-LqTfu7Y\"\r\n  not-youtube=\"false\"\r\n  theme=\"light\"\r\n/>\r\n<!-- end video-banner -->\r\n\r\n<!-- start overview-intro -->\r\n<pc-overview-intro\r\n  data-translate\r\n  title=\"THE CYCLING COMPUTER THAT LISTENS TO YOU\"\r\n  title-heading=\"h2\"\r\n  title-align=\"center\"\r\n  description=\"Edge 1060 is built for passionate and performance-driven cyclists. Unlock your potential with hands-free voice control<sup>1</sup>, advanced navigation and performance insights. Some training and performance features require a <a href='https://support.garmin.com/en-US/?faq=HShLPmOrV27VgUdVxgCJeA'>compatible heart rate monitor, power meter or both</a>.\"\r\n  description-size=\"large\"\r\n  description-align=\"center\"\r\n  theme=\"light\"\r\n>\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/AMOLED_Display.svg\"\r\n    img-width=\"50px\"\r\n    description=\"VIVID COLOR TOUCHSCREEN WITH BUTTONS\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Battery_Life.svg\"\r\n    img-width=\"50px\"\r\n    description=\"UP TO 20 HOURS OF BATTERY LIFE IN DEMANDING USE CASES AND UP TO 60 HOURS IN BATTERY SAVER MODE\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/microphone.svg\"\r\n    img-width=\"50px\"\r\n    description=\"BUILT-IN MICROPHONE FOR HANDS-FREE VOICE CONTROL AND MESSAGING\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/SPEAKER.svg\"\r\n    img-width=\"50px\"\r\n    description=\"BUILT-IN SPEAKER FOR NAVIGATION AND VOICE PROMPTS\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Garmin_Cycle_Map.svg\"\r\n    img-width=\"50px\"\r\n    description=\"SUPERIOR NAVIGATION AND BIKE-SPECIFIC MAPPING\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Measure_Data.svg\"\r\n    img-width=\"50px\"\r\n    description=\"INTELLIGENT TRAINING AND PERFORMANCE FEATURES\"\r\n  />\r\n</pc-overview-intro>\r\n<!-- end overview-intro -->\r\n\r\n</div><div><!-- start headline -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-column-layout\r\n    columns=\"1\"\r\n  >\r\n    <pc-headline\r\n      data-translate\r\n      primary-text=\"WHAT YOU'LL LOVE\"\r\n      padding-top=\"3\"\r\n      padding-bottom=\"3\"\r\n      text-size=\"2.6\"\r\n      mobile-text-size=\"2.4\"\r\n      text-align=\"center\"\r\n      mobile-text-align=\"center\"\r\n      theme=\"dark\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end headline -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04598-00/g/87255-hands-free-voice-control-1.jpg\"\r\n      title=\"HANDS-FREE VOICE CONTROL\"\r\n      description=\"A built-in microphone lets you control the device<sup>1</sup> hands-free with your voice. Send text and voice messages via the <a href=https://www.garmin.com/p/893837/>Garmin Messenger<sup>™</sup> app</a> and a connected smartphone.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04598-00/g/87255-advanced-navigation-2.jpg\"\r\n      title=\"ADVANCED NAVIGATION\"\r\n      description=\"Find the best routes, or have fun exploring, with unparalleled navigation features. Plus, get intelligent route options based on time and bike type, and find training routes with fewer stops.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04598-00/g/87255-see-whats-coming-3.jpg\"\r\n      title=\"SEE WHAT’S COMING\"\r\n      description=\"The Up Ahead feature lets you select what POIs you want to see while you’re riding a course — such as cafés, water fountains or public restrooms — and shows you how far away they are.\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04598-00/g/87255-road-hazard-alerts-4.jpg\"\r\n      title=\"ROAD HAZARD ALERTS\"\r\n      description=\"Get alerts for road hazards<sup>2</sup> reported by fellow cyclists — such as road closures or potholes — and contribute your own edits hands-free with the voice control feature.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04598-00/g/87255-garmin-coach-5.jpg\"\r\n      title=\"GARMIN COACH\"\r\n      description=\"Train for an event, achieve a milestone, or improve your fitness with personalized <a href=https://connect.garmin.com/features/coach/>Garmin Coach training plans</a> for cycling; Garmin Coach training plans even adapt to your training, recovery and demands of the course. You can even include strength workouts into your training routine.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04598-00/g/87255-groupride-6.jpg\"\r\n      title=\"GROUPRIDE\"\r\n      description=\"Stay connected on group rides<sup>2</sup> with in-ride messaging, live locations and incident detection alerts<sup>3</sup>; see in-ride leaderboards for climbs and real-time data compared to other riders. Easily join a GroupRide when you’re near an active one.\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start headline -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-column-layout\r\n    columns=\"1\"\r\n  >\r\n    <pc-headline\r\n      data-translate\r\n      primary-text=\"RIDE CONNECTED. EXPLORE MORE.\"\r\n      padding-top=\"3\"\r\n      padding-bottom=\"3\"\r\n      text-size=\"2.6\"\r\n      mobile-text-size=\"2.4\"\r\n      text-align=\"center\"\r\n      mobile-text-align=\"center\"\r\n      theme=\"dark\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end headline -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"PREPARE\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ZOOM-IN-AND-OUT-ON-YOUR-MAPS.svg\"\r\n      title=\"HIGH-ZOOM ROAD VISIBILITY\"\r\n      description=\"Easily navigate in unfamiliar areas — and see small and sometimes hidden roads on the map at high zoom levels.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Garmin_Cycle_Map.svg\"\r\n      title=\"BIKE-SPECIFIC MAPPING\"\r\n      description=\"Ride with <a href='https://support.garmin.com/en-US/?faq=T5bIktSUWiAkZKnYOV3Cq6'>preloaded maps</a> that include worldwide MTB trail data from Trailforks.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/RIDE-SPECIFIC-NAVIGATION---RIDE-SPECFIC-MAPS.svg\"\r\n      title=\"RIDE-SPECIFIC ROUTING\"\r\n      description=\"Get routing suited to your ride, whether you’re on mountain, gravel or road.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/NEXTFORK-MAP-GUIDE.svg\"\r\n      title=\"FORKSIGHT MODE\"\r\n      description=\"See the names of trails up ahead, including their distance, elevation and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Popularity-Routing.svg\"\r\n      title=\"TRENDLINE<sup>™</sup> POPULARITY ROUTING\"\r\n      description=\"Your Edge device finds the best route — choosing from roads (and trails) most traveled by other Garmin cyclists.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Courses.svg\"\r\n      title=\"FREE FLOW ROUTING\"\r\n      description=\"Keep your rhythm while you train and find training routes with fewer stops, intersections or unexpected slow sections of road.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/PIN-DROP-NAV.svg\"\r\n      title=\"PIN DROP NAVIGATION\"\r\n      description=\"Send a pin from Apple<sup>®</sup> Maps to your Edge and get bike-specific navigation.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/PLAN-MARK.svg\"\r\n      title=\"SEAMLESS COURSE SYNCING\"\r\n      description=\"Easily send and sync courses from the <a href=https://www.garmin.com/p/125677/>Garmin Connect<sup>™</sup> app</a> and third-party apps such as Strava, Komoot or Ride with GPS.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/CREATE-COURSES-AND-SEE-ROAD-SURFACE-TYPE.svg\"\r\n      title=\"ON-DEVICE COURSE CREATOR\"\r\n      description=\"Create courses right on device by using the touchscreen and see road surface type on the map.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/COURSE-PREVIEW.svg\"\r\n      title=\"COURSE PREVIEW\"\r\n      description=\"See distance, elevation, estimated ride time, surface type ratio, high traffic road percentage and number of road hazards so you know what to expect.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/TRAINING-READINESS.svg\"\r\n      title=\"CYCLING ABILITY AND COURSE DEMANDS\"\r\n      description=\"Compare your <a href=https://www.garmin.com/garmin-technology/cycling-science/physiological-measurements/cycling-ability/>cycling ability</a> to the demands of a specific course, and focus your training.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/CYCLING-TRAINING-STATUS.svg\"\r\n      title=\"TRAINING STATUS\"\r\n      description=\"Evaluate your performance indicators to see if you’re <a href=https://www.garmin.com/garmin-technology/cycling-science/physiological-measurements/training-status/>training</a> productively.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Workout-Recommendations_Daily-Workout-Suggestions.svg\"\r\n      title=\"DAILY SUGGESTED WORKOUTS\"\r\n      description=\"Get <a href=https://www.garmin.com/en-US/garmin-technology/cycling-science/physiological-measurements/daily-suggested-workouts/>daily ride suggestions</a> based on your fitness level, current <a href=https://www.garmin.com/en-US/garmin-technology/cycling-science/physiological-measurements/training-load/>training load</a> and VO2 max.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Interval-Creation.svg\"\r\n      title=\"WORKOUT SCREEN\"\r\n      description=\"See your training data and workouts on the redesigned dynamic workout screen.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/HEAT-AND-ALTITUDE-ACCLIMATION.svg\"\r\n      title=\"HEAT AND ALTITUDE ACCLIMATION\"\r\n      description=\"See how your body is holding up with heat and altitude acclimation.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Weather.svg\"\r\n      title=\"REAL-TIME WEATHER UPDATES\"\r\n      description=\"Monitor the weather, and make more informed decisions in-ride with weather radar and wind direction overlays when used with your compatible smartphone and Garmin Connect.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Wi-Fi.svg\"\r\n      title=\"MAP MANAGER WITH WI-FI<sup>®</sup> CONNECTIVITY\"\r\n      description=\"Add, swap or update maps via Wi-Fi on your device.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/RIDE-READINESS.svg\"\r\n      title=\"RIDE READINESS MENU\"\r\n      description=\"The status menu shows you a preride checklist in each ride profile that tells you which sensors are paired, their battery status and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"TRAIN AND PERFORM\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/CYCLING-STAMINA-INSIGHTS.svg\"\r\n      title=\"REAL-TIME STAMINA INSIGHTS\"\r\n      description=\"<a href=https://www.garmin.com/en-US/garmin-technology/cycling-science/physiological-measurements/real-time-stamina/>Stamina insights</a> show how much energy you have left at your current effort.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/POWER-GUIDE.svg\"\r\n      title=\"POWER GUIDE\"\r\n      description=\"Manage efforts with recommended power targets based on real-time stamina, altitude and wind<sup>2</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/AUTOMATICALLY-RESPONDS-TO-VIRTUAL-GRADE-CHANGES.svg\"\r\n      title=\"CLIMBPRO ASCENT PLANNER\"\r\n      description=\"See <a href=https://www.garmin.com/en-US/garmin-technology/cycling-science/physiological-measurements/climbpro/>remaining ascent and grade</a> when climbing on every ride so you can gauge your effort and view nearby climbs on the map.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Strava.svg\"\r\n      title=\"STRAVA LIVE SEGMENTS\"\r\n      description=\"See Strava segments in real time on your device as you ride or explore the map for nearby segments and see what it takes to become the next KOM or QOM.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Cycling-Dynamics.svg\"\r\n      title=\"CYCLING DYNAMICS\"\r\n      description=\"<a href=https://www.garmin.com/en-US/performance-data/cycling/#cycling-dynamics>Advanced cycling metrics</a> give insight into your performance and fitness in real time and in even greater detail after your ride.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ENDURO-AND-DOWNHILL-RIDE-PROFILES.svg\"\r\n      title=\"ENDURO AND DOWNHILL RIDE PROFILES\"\r\n      description=\"Track total ascent and descent from each run and for the ride overall. It will also automatically detect and switch between climbs and descents.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/5HZ-GPS.svg\"\r\n      title=\"5 HZ GPS RECORDING\"\r\n      description=\"See greater detail about the lines you take down the trail with multi-band GPS with 5 Hz GPS recording while using the enduro or downhill ride profiles.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/AUTOMATICALLY-TRACK-SPLIT.svg\"\r\n      title=\"SET TIMING GATES\"\r\n      description=\"Set timing gates throughout a course to track split times and better understand your performance in real time.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MTB-DYNAMICS---MOUNTAIN-BIKE-DYNAMICS.svg\"\r\n      title=\"MTB DYNAMICS\"\r\n      description=\"Track <a href=https://www.garmin.com/en-US/garmin-technology/cycling-science/mtb-dynamics/>mountain biking metrics</a> such as jump count, jump distance and hang time.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/GRIT-AND-FLOW-METRICS.svg\"\r\n      title=\"GRIT<sup>®</sup> AND FLOW<sup>™</sup> METRICS\"\r\n      description=\"<a href=https://www.garmin.com/en-US/garmin-technology/cycling-science/mtb-dynamics/grit/>Grit</a> rates the difficulty of a trail. <a href=https://www.garmin.com/en-US/garmin-technology/cycling-science/mtb-dynamics/flow/>Flow</a> measures how smoothly you ride it.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/COMPASS.svg\"\r\n      title=\"TURN-BY-TURN DIRECTIONS\"\r\n      description=\"Stay on track with turn-by-turn directions and alerts so you know what to expect.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/back-to-start.svg\"\r\n      title=\"BACK TO START\"\r\n      description=\"Get back on track — or back to start — if you’re lost or want to go home early.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/hyrdation.svg\"\r\n      title=\"NUTRITION AND HYDRATION ALERTS\"\r\n      description=\"Stay fueled on a ride with notifications when it’s time to hydrate or eat.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/FOOD-MART-FUELING.svg\"\r\n      title=\"SMART FUELING\"\r\n      description=\"When using power guide or following a workout, get detailed fueling guidance throughout your ride based on your fitness, course demands, heat and humidity.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/GEAR-RATIO-ANALYSIS.svg\"\r\n      title=\"GEAR RATIO ANALYSIS\"\r\n      description=\"After the ride, see time spent in each gear ratio, when paired with your electronic shifting.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"CYCLING SAFETY AND AWARENESS\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Vara_Compatability.svg\"\r\n      title=\"COMPATIBILITY WITH VARIA<sup>™</sup> DEVICES\"\r\n      description=\"Pair your Edge device with your <a href='https://www.garmin.com/c/sports-fitness/cycling-bike-computers-bike-radar-power-meter-headlights/?series=BRAND10561&amp;sorter=featuredProducts-desc'>Varia rearview radar and smart lights</a> to see and be seen. You can even control your Varia device from your Edge.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Incident_Detection.svg\"\r\n      title=\"INCIDENT DETECTION\"\r\n      description=\"This feature sends a message with your location<sup>3</sup> to <a href='https://support.garmin.com/en-US/?faq=RfaXahBWkH8Q7pVFLsuUmA'>emergency contacts</a> after an on- or off-road incident. When using the GroupRide feature, get alerts for incidents of other riders.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/live-tracking.svg\"\r\n      title=\"LIVETRACK<sup>™</sup> LOCATION SHARING\"\r\n      description=\"Friends and family can follow your location in real time and see data such as speed and course plans<sup>3</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/waze.svg\"\r\n      title=\"YOUR LIVE LOCATION IN WAZE\"\r\n      description=\"Drivers using Waze can get alerts for nearby cyclists via <a href=https://www.garmin.com/garmin-technology/cycling-science/>LiveTrack location sharing</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BIKE-ALARM.svg\"\r\n      title=\"BIKE ALARM\"\r\n      description=\"A PIN-protected alarm notifies you via your compatible smartphone if your bike is moved.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/SOS.svg\"\r\n      title=\"INREACH<sup>®</sup> DEVICE COMPATIBILITY\"\r\n      description=\"Stay in touch out of cell service by pairing with your compatible  <a href='https://www.garmin.com/c/outdoor-recreation/satellite-communicators/?series=BRAND11460'>inReach device</a><sup>4</sup>. Exchange messages, share trip details and more right from your device.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ON-DEVICE-BIKE-BELL.svg\"\r\n      title=\"LOUD BIKE BELL\"\r\n      description=\"Alert riders and pedestrians with an on-device bike bell by double-tapping on any screen.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"CONNECTIVITY\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/GARMIN-MESSENGER-APP.svg\"\r\n      title=\"GARMIN MESSENGER APP\"\r\n      description=\"Send text and voice messages via the Garmin Messenger app on your Edge and your connected smartphone; exchange messages between other compatible Edge devices, Garmin smartwatches or smartphones with the Garmin Messenger app.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Share.svg\"\r\n      title=\"GARMIN SHARE\"\r\n      description=\"Share saved locations, courses and workouts with other compatible devices via Bluetooth<sup>®</sup> connectivity.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Music.svg\"\r\n      img-alt=\"Lorem ipsum dolor sit amet\"\r\n      title=\"MUSIC CONTROLS\"\r\n      description=\"When paired to your smartphone, you can control your music — right on your Edge — and still see the data that’s important to you.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Messaging.svg\"\r\n      title=\"SMART NOTIFICATIONS\"\r\n      description=\"Receive texts and alerts on your Edge cycling computer when paired with your compatible smartphone.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Garmin_Pay.svg\"\r\n      title=\"GARMIN PAY<sup>™</sup> CONTACTLESS PAYMENTS\"\r\n      description=\"Make purchases on the go with Garmin Pay contactless payments with <a href=https://www.garmin.com/garmin-pay/>participating providers</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/GEAR-TRACKING.svg\"\r\n      title=\"GEAR TRACKING\"\r\n      description=\"Assign gear or gear collections to ride profiles or log it after the ride in Garmin Connect.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/SMART-TRAINER--COMPATIBILITY.svg\"\r\n      title=\"SMART TRAINER COMPATIBILITY\"\r\n      description=\"This Edge can pair with your <a href=https://www.garmin.com/c/sports-fitness/indoor-trainers/>indoor smart trainer</a> to track your home rides.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/eBike-Compatible.svg\"\r\n      title=\"EBIKE COMPATIBILITY\"\r\n      description=\"Connect to your compatible eBike, such as Bosch smart systems or Shimano eBike systems, so you can see battery stats, range and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ELECTRONIC-SHIFTING-CONNECTIVITY.svg\"\r\n      title=\"ELECTRONIC SHIFTING CONNECTIVITY\"\r\n      description=\"Configure select shifting systems to control your Edge device and view battery life, swipe through data pages and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Battery_Life.svg\"\r\n      title=\"REVERSE CHARGING\"\r\n      description=\"Charge other devices, such as your compatible phone or tail light, in emergency situations with reverse charging<sup>5</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Garmin_Connect.svg\"\r\n      title=\"SYNC WITH GARMIN CONNECT\"\r\n      description=\"View ride details, check fitness and performance progress, build a custom course, earn Garmin Connect badges and so much more in Garmin Connect.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/CONNECT-IQ-STORE.svg\"\r\n      title=\"CONNECT IQ<sup>™</sup> STORE\"\r\n      description=\"Download custom data fields, and get apps and widgets from our <a href=https://apps.garmin.com/>Connect IQ Store</a> smartphone app.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start disclaimer -->\r\n<pc-layout-container\r\n  theme=\"neutral\"\r\n>\r\n  <pc-disclaimer-block>\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"1\"\r\n      content=\"Voice command performance may vary based on riding conditions; voice command available in select languages\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"2\"\r\n      content=\"When used with your compatible smartphone and the <a href=https://www.garmin.com/p/125677>Garmin Connect</a> app\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"3\"\r\n      content=\"When paired with your <a href='https://support.garmin.com/en-US/?faq=pvL8aWsaLU2iKyvF8VrpP9&amp;searchType=noProduct'>smartphone</a>. For safety and tracking feature requirements and limitations, see <a href='https://support.garmin.com/en-US/?faq=RfaXahBWkH8Q7pVFLsuUmA'>Garmin.com/safety</a>.\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"4\"\r\n      content=\"Active satellite subscription required. Some jurisdictions regulate or prohibit satellite communication devices; it is the user’s responsibility to know and follow all applicable laws.\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"5\"\r\n      content=\"Compatible USB-C<sup>®</sup> cable required; not intended to charge while riding\"\r\n    />\r\n  </pc-disclaimer-block>\r\n  <pc-disclaimer-block>\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      content=\"Apple is a trademark of Apple Inc., registered in the U.S. and other countries. The Bluetooth word mark and logos are registered trademarks owned by Bluetooth SIG, Inc. and any use of such marks by Garmin is under license.\"\r\n    />\r\n  </pc-disclaimer-block>\r\n</pc-layout-container>\r\n<!-- end disclaimer -->\r\n\r\n</div>"},"mapsTab":{"title":"Maps","content":"<h2>Maps for New Regions</h2><p>Need maps for regions other than the ones that came on your device? See all maps that are compatible with your device.</p><form action=\"\" class=\"app__layout__flex-container\" id=\"form-compatible-maps\" name=\"form-compatible-maps\"><div class=\"app__layout__half\"><label for=\"js__regionSelect\">Where are you going?</label><select id=\"js__regionSelect\" class=\"app__select-box\" autocomplete=\"off\"><option value=\"\" selected=\"selected\">Select Continent</option><option value=\"Africa\">Africa</option><option value=\"Asia\">Asia</option><option value=\"Australia\">Australia Oceania</option><option value=\"Europe\">Europe</option><option value=\"Middle East\">Middle East</option><option value=\"North America\">North America</option><option value=\"South America\">South America</option><option value=\"all\">All</option></select></div><div class=\"app__layout__half\"><label for=\"js__activitySelect\">What type of maps do you need?</label><select id=\"js__activitySelect\" class=\"app__select-box\" autocomplete=\"off\"><option value=\"\" selected=\"selected\">Select Activity</option><option value=\"road\">On the Road</option><option value=\"marine\">On the Water</option><option value=\"topo\">On the Trail</option><option value=\"golf\">On the Green</option><option value=\"all\">All</option></select></div></form><div id=\"compatibleMaps\"></div><hr /><h2>Need a map update?</h2><p>Update the maps that came with your device for the best navigation experience.</p><p><a href=\"http://www.garmin.com/en-US/maps/updates/\">Check for Updates</a></p>"},"inTheBoxTab":{"title":"In the Box","content":"<ul>\r\n\t<li>Edge 1060 GPS cycling computer</li>\r\n\t<li>Flush out-front mount</li>\r\n\t<li>Standard mount</li>\r\n\t<li>Tether</li>\r\n\t<li>Charging/data cable</li>\r\n\t<li>Documentation</li>\r\n</ul>\r\n"},"accessoriesTab":{"title":"Accessories","content":null},"specsTab":{"title":"Specs","content":"<div><table>\n        <tbody>\n        <tr class=\"title\">\n            <td colspan=\"2\" style=\"background: #fff; color: #000; border: 1px solid #ddd; border-width: 0px 0px 1px 0px; padding: 0px;\">\n                <h3>What You'll Love</h3>\n            </td>\n        </tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Garmin Pay™</th><td class=\"yes\"></td></tr></tbody></table><table>\n        <tbody>\n        <tr class=\"title\">\n            <td colspan=\"2\" style=\"background: #fff; color: #000; border: 1px solid #ddd; border-width: 0px 0px 1px 0px; padding: 0px;\">\n                <h3>General</h3>\n            </td>\n        </tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">In-ride power compatible (Power Mount and Garmin Charge battery pack)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Reverse charging capable</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Dimension</th><td>58.5 x 107 x 16
