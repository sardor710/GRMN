k™ navigation</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Preloaded road and trail maps</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Preloaded ski resort maps</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Downloadable cartography support</th><td class=\"yes\"></td></tr></tbody></table><table>\n        <tbody>\n        <tr class=\"title\">\n            <td colspan=\"2\" style=\"background: #fff; color: #000; border: 1px solid #ddd; border-width: 0px 0px 1px 0px; padding: 0px;\">\n                <h3>Cycling Features</h3>\n            </td>\n        </tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Courses</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Bike lap and lap maximum power (with power sensor)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Race an activity</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Alerts (triggers alarm when you reach goals including time, distance, heart rate or calories)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\"><a href='https://www.garmin.com/en-US/garmin-technology/cycling-science/physiological-measurements/ftp/'>FTP</a> (Functional Threshold Power)</th><td>yes (with compatible accessory)</td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Power curve and % FTP workouts</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Cycle Map (routable cycling-specific street map)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\"><a href='https://www.garmin.com/en-US/garmin-technology/cycling-science/mtb-dynamics/grit/'>MTB Grit & Flow</a></th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Advanced cycling dynamics</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Compatible with Vector™ and Rally™ (power meters)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Compatible with Varia™ radar (rear-facing radar)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Compatible with Varia™ lights</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Compatible with Varia™ headlight camera</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Speed and cadence sensor support (w/sensor)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Power meter compatible</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Power guide</th><td class=\"yes\"></td></tr></tbody></table><table>\n        <tbody>\n        <tr class=\"title\">\n            <td colspan=\"2\" style=\"background: #fff; color: #000; border: 1px solid #ddd; border-width: 0px 0px 1px 0px; padding: 0px;\">\n                <h3>Swimming Features</h3>\n            </td>\n        </tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Open-water swim metrics (distance, pace, stroke count/rate, stroke distance, swim efficiency (SWOLF), calories)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Pool swim metrics (lengths, distance, pace, stroke count, swim efficiency (SWOLF), calories)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Stroke type detection (freestyle, backstroke, breaststroke, butterfly) (pool swim only)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Drill logging (pool swim only)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Basic rest timer (up from 0) (pool swim only)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">\"Repeat on\" rest timer (pool swim only)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Auto rest (pool swim only)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Time and distance alerts</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Pacing alerts (pool swim only)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Countdown start (pool swim only)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Pool swim workouts</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Critical swim speed</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Underwater wrist-based heart rate</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Heart rate from external HRM (real-time during rests, interval and session stats during rests, and automatic heart rate download post-swim)</th><td>yes (with compatible HRM)</td></tr></tbody></table></div>"},"overviewTab":{"title":"Overview","content":"<div><!-- keep this to ensure overview section goes to full width layout -->\r\n<overview-container/>\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-1-D_01.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-1-M_01.jpg\"\r\n  link=\"https://www.garmin.com/connectivity/smartwatches/fenix-9-pro/feature-requirements/\"\r\n  theme=\"light\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-1-D_02.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-1-M_02.jpg\"\r\n  text=\"PLAY HARDER\"\r\n  text-size=\"2.3\"\r\n  text-align=\"center\"\r\n  text-position=\"middle\"\r\n  mobile-text-size=\"2.3\"\r\n  mobile-text-align=\"center\"\r\n  mobile-text-position=\"middle\"\r\n  button-text=\"FĒNIX® 9 PRO WITH INREACH® TECHNOLOGY<br /><br />Learn More\"\r\n  link=\"https://www.garmin.com/connectivity/smartwatches/fenix-9-pro/feature-requirements/\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04335-25/g/87619-3-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04335-25/g/87619-3-M.jpg\"\r\n  text=\"<br />TELL ONE<br />INCREDIBLE STORY\"\r\n  text-size=\"2.3\"\r\n  text-align=\"left\"\r\n  text-position=\"top\"\r\n  mobile-text-size=\"2.3\"\r\n  mobile-text-align=\"center\"\r\n  mobile-text-position=\"bottom\"\r\n  button-text=\"GROUP ACTIVITiES TOGETHER WITH GARMIN EPIC\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04337-10/g/87620-2-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04337-10/g/87620-2-M.jpg\"\r\n  text=\"<br />UNSTOPPABLE STRENGTH\"\r\n  text-size=\"2.6\"\r\n  text-align=\"right\"\r\n  text-position=\"bottom\"\r\n  mobile-text-size=\"2.4\"\r\n  mobile-text-align=\"center\"\r\n  mobile-text-position=\"top\"\r\n  button-text=\"LIGHTWEIGHT TITANIUM CASE\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04763-10/g/87564-6-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04763-10/g/87564-6-M.jpg\"\r\n  text=\"<br />ROAM CONNECTED\"\r\n  text-size=\"2.3\"\r\n  text-align=\"left\"\r\n  text-position=\"top\"\r\n  mobile-text-size=\"2.3\"\r\n  mobile-text-align=\"center\"\r\n  mobile-text-position=\"top\"\r\n  button-text=\"VOICE CALLS AND TEXTING ON YOUR WRIST WITH LTE CONNECTIVITY\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04337-10/g/87620-5-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04337-10/g/87620-5-M.jpg\"\r\n  text=\"LARGER THAN LIFE\"\r\n  text-size=\"2.3\"\r\n  text-align=\"left\"\r\n  text-position=\"bottom\"\r\n  mobile-text-size=\"2.3\"\r\n  mobile-text-align=\"center\"\r\n  mobile-text-position=\"bottom\"\r\n  button-text=\"OUR BIGGEST EVER FĒNIX DISPLAY\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start video-banner -->\r\n<pc-video-banner\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04337-10/g/87594-VID-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04337-10/g/87594-VID-M.jpg\"\r\n  video-link=\"https://www.youtube-nocookie.com/embed/bdOC8EBYs_E\"\r\n  not-youtube=\"false\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end video-banner -->\r\n\r\n<!-- start social-gallery -->\r\n<pc-social-gallery\r\n  data-translate\r\n  heading=\"Show us what you’ve got. Tag @garmin on Instagram.\"\r\n  category-key=\"FENIX 9\"\r\n  product-id=\"1953453\"\r\n  locale=\"en-US\"\r\n/>\r\n<!-- end social-gallery -->\r\n\r\n<!-- start line-divider -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"33\"\r\n    color=\"white\"\r\n  />\r\n</pc-layout-container>\r\n<!-- end line-divider -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04337-10/g/87610-D-FAN.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04337-10/g/87610-M-FAN.jpg\"\r\n  theme=\"light\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start overview-intro -->\r\n<pc-overview-intro\r\n  data-translate\r\n  title=\"TITANIUM STRONG, INREACH<sup>®</sup> CONNECTED\"\r\n  title-heading=\"h2\"\r\n  title-align=\"center\"\r\n  description=\"Built for serious athletes and outdoor adventurers, this premium multisport GPS smartwatch has a durable titanium case and a bright AMOLED display that’s the largest of any fēnix smartwatch ever. It features enhanced stamina and endurance tracking, an LED flashlight, and inReach LTE and satellite connectivity to keep you in touch on or off the grid.\"\r\n  description-size=\"large\"\r\n  description-align=\"center\"\r\n  theme=\"light\"\r\n>\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Titanium.svg\"\r\n    img-width=\"50px\"\r\n    description=\"DURABLE AND LIGHTWEIGHT TITANIUM WATCH CASE\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Battery_Life.svg\"\r\n    img-width=\"50px\"\r\n    description=\"UP TO 31 DAYS OF BATTERY LIFE IN SMARTWATCH MODE\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/SOS.svg\"\r\n    img-width=\"50px\"\r\n    description=\"INREACH CONNECTIVITY<sup>1</sup> FOR LTE AND SATELLITE COVERAGE\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/TRAINING-GUIDANCE.svg\"\r\n    img-width=\"50px\"\r\n    description=\"ADVANCED TRAINING AND PERFORMANCE FEATURES\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/AMOLED_Display.svg\"\r\n    img-width=\"50px\"\r\n    description=\"BRIGHT, CRISP AMOLED DISPLAY\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Heart_Rate_Sensors.svg\"\r\n    img-width=\"50px\"\r\n    description=\"24/7 HEALTH AND WELLNESS FEATURES\"\r\n  />\r\n</pc-overview-intro>\r\n<!-- end overview-intro -->\r\n\r\n</div><div><!-- start headline -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-column-layout\r\n    columns=\"1\"\r\n  >\r\n    <pc-headline\r\n      data-translate\r\n      primary-text=\"WHAT YOU'LL LOVE\"\r\n      padding-top=\"3\"\r\n      padding-bottom=\"3\"\r\n      text-size=\"2.6\"\r\n      mobile-text-size=\"2.4\"\r\n      text-align=\"center\"\r\n      mobile-text-align=\"center\"\r\n      theme=\"dark\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end headline -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04337-10/g/87610-1.jpg\"\r\n      title=\"RUGGED TITANIUM DESIGN\"\r\n      description=\"Crafted to endure, this watch has our largest display on a fēnix to date — a 1.5-inch AMOLED with up to 3,000 nits of brightness — plus a scratch-resistant sapphire lens, leakproof metal buttons, integrated LED flashlight and the first-ever titanium fēnix watch case for lightweight comfort and durability. It’s also dive-rated and tested to U.S. military standards for thermal, shock and water resistance.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04337-10/g/87610-2.jpg\"\r\n      title=\"STAY CONNECTED, PHONE-FREE\"\r\n      description=\"Enjoy connectivity on the go with voice calls, messaging and LiveTrack<sup>™</sup> location sharing via LTE. Or, when venturing off-grid, the watch’s inReach technology<sup>1</sup> allows you to send message check-ins and get weather forecasts — once you establish a satellite link — with no phone connection required.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04337-10/g/87610-3.jpg\"\r\n      title=\"SOS MESSAGING AND THE GARMIN RESPONSE<sup>℠</sup> CENTER\"\r\n      description=\"Need help? With <a href=https://www.garmin.com/connectivity/smartwatches/fenix-9-pro/feature-requirements/>inReach satellite and LTE connectivity</a><sup>1</sup>, you can trigger an interactive SOS message for emergency support from the 24/7-staffed <a href=https://www.garmin.com/en-US/satellite-communicators/interactive-sos-and-garmin-response/>Garmin Response coordination center</a>. You also get free emergency SOS messaging for up to 12 months after the free trial period.\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04337-10/g/87610-4.jpg\"\r\n      title=\"ADVANCED TRAINING TOOLS\"\r\n      description=\"Access more than 100 activity profiles plus advanced training and performance tools. Enhanced stamina metrics show how your endurance is changing based on your fitness gains and training history.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04337-10/g/87610-5.jpg\"\r\n      title=\"FIND YOUR WAY\"\r\n      description=\"Multicontinent <a href=https://www.garmin.com/Support/FAQ/TopoActiveMaps>TopoActive maps</a> are smoother and more intuitive, offering advanced navigational tools such as dynamic round-trip routing, NextFork<sup>™</sup> map guide, grade-adjusted running pace and more.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04337-10/g/87610-6.jpg\"\r\n      title=\"GARMIN EPIC\"\r\n      description=\"This <a href=https://www.garmin.com/garmin-technology/maps-for-smartwatches/garmin-epic/>feature</a> lets you record, relive and share multiple days of activities with photos, as well as health and performance stats, in a cohesive story of events over time.\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start headline -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-column-layout\r\n    columns=\"1\"\r\n  >\r\n    <pc-headline\r\n      data-translate\r\n      primary-text=\"STAY IN CONTACT WITH INREACH TECHNOLOGY\"\r\n      padding-top=\"3\"\r\n      padding-bottom=\"3\"\r\n      text-size=\"2.6\"\r\n      mobile-text-size=\"2.4\"\r\n      text-align=\"center\"\r\n      mobile-text-align=\"center\"\r\n      theme=\"dark\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end headline -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/PHONE-FREE-VOICE-CALLS.svg\"\r\n      title=\"PHONE-FREE VOICE CALLS\"\r\n      description=\"When you have an LTE connection, the Messenger Calls app on your watch lets you initiate and receive voice calls with other <a href=https://www.garmin.com/p/893837/>Garmin Messenger<sup>™</sup> app</a> users — without needing to carry your smartphone.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/On-Wrist-Texting.svg\"\r\n      title=\"MESSAGING ON THE GO\"\r\n      description=\"Through satellite or LTE connection, messages can be shared with other Garmin Messenger app users directly from your watch. The app will automatically sync with your contacts when your watch is paired with your smartphone.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/NO-SWITCH-PROVIDERS.svg\"\r\n      title=\"NO NEED TO SWITCH PROVIDERS\"\r\n      description=\"You’ll activate your <a href=https://www.garmin.com/p/837461/>plan</a> through Garmin, not your cellular provider, so access to inReach services is a seamless connection through your watch.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/AVOID-LTE-M.svg\"\r\n      title=\"SAVE POWER\"\r\n      description=\"This watch uses an LTE-M network, which is designed to use less power and minimize battery drain on your watch to keep your adventures going longer and stronger.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/live-tracking.svg\"\r\n      title=\"LIVETRACK LOCATION SHARING\"\r\n      description=\"LTE network connectivity<sup>1</sup> lets friends follow your adventures. They’ll be notified in the Garmin Messenger app that you have started a LiveTrack sequence, and they can use the app to view your progress and message you during your activity.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/weather.svg\"\r\n      title=\"WEATHER FORECASTS\"\r\n      description=\"Via an LTE or satellite connection, access current weather conditions and multiday forecasts directly on your watch to help you stay prepared for what’s ahead on your route.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/VISUAL-RECALL.svg\"\r\n      title=\"LOCATION CHECK-INS\"\r\n      description=\"Over satellite or LTE, user-initiated location updates can be sent to family and friends, keeping them apprised of your progress on trips and adventures.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/TrackShareLocation.svg\"\r\n      title=\"GARMIN LOCATE\"\r\n      description=\"Allows trusted, preselected contacts to automatically poll your smartwatch and view your last available location when paired to your smartphone, or phone-free with an LTE or satellite connection.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"PERFORMANCE\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/real-time-staminia.svg\"\r\n      title=\"STAMINA METRICS\"\r\n      description=\"This <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/real-time-stamina/>feature</a> helps you visualize the impact of your endurance training based on your fitness gains and training history.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/TRAINING-READINESS.svg\"\r\n      title=\"TRAINING READINESS\"\r\n      description=\"From the moment you wake up, get a <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/training-readiness/>readiness score</a> based on your sleep quality<sup>2</sup>, recovery, training load and more, so you can determine if it’s a good day to go hard — or take it easy.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/training-status.svg\"\r\n      title=\"TRAINING STATUS\"\r\n      description=\"Get <a href=https://www.garmin.com/garmin-technology/running-science/#training-status>insight</a>, and know whether you’re training productively, peaking or strained.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Garmin_Coach.svg\"\r\n      title=\"GARMIN COACH\"\r\n      description=\"Reach your goals with Garmin Coach training plans for running, cycling, strength and fitness; some even adapt based on your health and fitness metrics.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Race-Predictor.svg\"\r\n      title=\"VISUAL RACE PREDICTOR\"\r\n      description=\"Get an <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/race-time-prediction/>estimate of what your pace could be</a> for a 5K, 10K, half marathon and marathon.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Dynamic_PacePro.svg\"\r\n      title=\"PACEPRO<sup>™</sup> TECHNOLOGY\"\r\n      description=\"Plan <a href=https://www.garmin.com/garmin-technology/wearable-maps/pacepro/>race-day strategy</a> with GPS-based pace guidance for a selected course or distance.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Simulate_Inclines.svg\"\r\n      title=\"CLIMBPRO FEATURE\"\r\n      description=\"See <a href=https://www.garmin.com/garmin-technology/cycling-science/physiological-measurements/climbpro/>real-time information</a> on your current and upcoming climbs on downloaded courses.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/GRADE-ADJUSTED-PACE.svg\"\r\n      title=\"GRADE-ADJUSTED ROLLING PACE\"\r\n      description=\"Get a continually updated average pace with grade adjustments.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Measure_Data.svg\"\r\n      title=\"PERFORMANCE METRICS\"\r\n      description=\"Gauge your performance with advanced training metrics such as <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/vo2-max/>VO2 max</a>, training load and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ENDURANCE-SCORE.svg\"\r\n      title=\"ENDURANCE SCORE\"\r\n      description=\"Measuring your ability to <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/endurance-score/>sustain prolonged efforts</a>, this feature helps you see how training from your athletic pursuits impacts your overall endurance.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/HILL-SCORE.svg\"\r\n      title=\"HILL SCORE\"\r\n      description=\"Measure your capability for <a href=https://www.garmin.com/garmin-technology/running-science/running-dynamics/hill-score/>running uphill</a>, and evaluate your progress over time based on your VO2 max and training history.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Workout-Recommendations_Daily-Workout-Suggestions.svg\"\r\n      title=\"DAILY SUGGESTED WORKOUTS\"\r\n      description=\"View your entire week of <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/daily-suggested-workouts-feature/>daily suggested workouts</a>, which adapt after every run or ride.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/recovery-time.svg\"\r\n      title=\"RECOVERY TIME\"\r\n      description=\"Know <a href='https://support.garmin.com/en-US/?faq=8ImmxVkZMh4EYYq5Zp2bR8'>how long you need to recover</a> before your next high-effort workout based on your latest training.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/wrist-based-running-dynamics.svg\"\r\n      title=\"WRIST-BASED RUNNING DYNAMICS\"\r\n      description=\"View crucial running metrics such as cadence, stride length, ground contact time and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/RUNNING-ECONOMY.svg\"\r\n      title=\"RUNNING ECONOMY\"\r\n      description=\"Measure your overall energy efficiency while running — using long-term running volume, stride length and step speed loss — when you pair your watch with the <a href=https://www.garmin.com/p/1473393/>HRM 600</a> monitor (sold separately).\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/RUNNING-TOLERANCE.svg\"\r\n      title=\"RUNNING TOLERANCE\"\r\n      description=\"Better understand the impact each run has on your body, and get a recommended weekly maximum mileage so you can keep training effectively without taking on too much.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/STEP-SPEED-LOSS.svg\"\r\n      title=\"STEP SPEED LOSS\"\r\n      description=\"Improve your running form, and understand how much you slow down when your foot hits the ground when you pair your watch with the <a href=https://www.garmin.com/p/1473393/>HRM 600</a> monitor (sold separately).\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Real-time.svg\"\r\n      title=\"PROJECTED RACE TIME\"\r\n      description=\"This race-time prediction is what your race time and pace could be if you keep training well all the way through to the race date entered.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"ACTIVITIES\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/track-fitness.svg\"\r\n      title=\"TRACK YOUR ACTIVITIES\"\r\n      description=\"Use preloaded activity profiles to get data and insight from your active pursuits. Even track team sport activities such as soccer, football, racquet sports and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/LIFESTYLE.svg\"\r\n      title=\"TRIATHLON AND MULTISPORT PROFILES\"\r\n      description=\"Automatically record splits with built-in profiles for triathlons, duathlons, brick workouts and swim/runs, or you can create your own.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/cross-training.svg\"\r\n      title=\"CROSS-TRAINING\"\r\n      description=\"Download the free HIIT, strength, cardio, yoga, Pilates and mobility workouts so you can switch up how you sweat.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/On-screen_workouts.svg\"\r\n      title=\"ANIMATED WORKOUTS\"\r\n      description=\"Follow animated workouts for cardio, strength, yoga and Pilates on the watch screen.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BACKCOUNTRY-SKI-AND-SNOWBOARD.svg\"\r\n      title=\"BACKCOUNTRY SKI AND SNOWBOARD\"\r\n      description=\"Automatically track ascents and descents along with how much time you spend between runs.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Multiple-Dive-Modes.svg\"\r\n      title=\"RECREATIONAL DIVING\"\r\n      description=\"A 40-meter dive rating and leakproof metal buttons let you reach new depths with support for scuba and apnea dive activities.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/surf.svg\"\r\n      title=\"SURF ACTIVITY\"\r\n      description=\"Record waves surfed, maximum speed reached, distance traveled and more. Use <a href=https://www.surfline.com/lp/garmin-sessions>Surfline Sessions</a><sup>™</sup> technology to capture video of waves you ride in front of a Surfline<sup>®</sup> camera.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/advanced-swim-metrics.svg\"\r\n      title=\"ADVANCED SWIM METRICS\"\r\n      description=\"Swim smarter with metrics like swolf to track efficiency, stroke type, pace and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MTB-DYNAMICS---MOUNTAIN-BIKE-DYNAMICS.svg\"\r\n      title=\"MTB DYNAMICS\"\r\n      description=\"Track the details of your ride with specialized  <a href=https://www.garmin.com/garmin-technology/cycling-science/mtb-dynamics/grit/>Grit</a><sup>®</sup> and <a href=https://www.garmin.com/garmin-technology/cycling-science/mtb-dynamics/flow/>Flow</a><sup>™</sup> measurements.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ROWING-ACTIVITY.svg\"\r\n      title=\"ROWING ACTIVITY\"\r\n      description=\"Record indoor or outdoor <a href=https://www.garmin.com/garmin-technology/rowing-science/>rowing</a> workouts. For indoor, VO2 max helps gauge cardio fitness and training impact (requires a power meter-equipped rowing machine).\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/RUCKING-ACTIVITY.svg\"\r\n      title=\"RUCKING ACTIVITY\"\r\n      description=\"Set a target metric, create a custom workout, and change pack weight during the <a href=https://www.garmin.com/garmin-technology/rucking-science/>activity</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ARCHERYX.svg\"\r\n      title=\"ARCHERYX\"\r\n      description=\"Advanced shot timing and aiming metrics give archers real-time data and analysis to help improve their precision and accuracy.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"NAVIGATION\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Outdoor-Maps.svg\"\r\n      title=\"OUTDOOR MAPS+\"\r\n      description=\"Get an <a href=https://www.garmin.com/p/893561>Outdoor Maps+</a> plan for premium mapping content, such as satellite imagery and enhanced topographic maps. More memory capacity means the fēnix 9 Pro smartwatch can download and store twice as many maps from Outdoor Maps+ as previous fēnix versions.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/GARMIN-TRAILS.svg\"\r\n      title=\"GARMIN TRAILS\"\r\n      description=\"Access thousands of trails, and send them directly to your compatible device for offline use with a <a href=https://www.garmin.com/p/1565777/pn/010-D2234-SU/>Garmin Connect+</a> plan in the <a href=https://www.garmin.com/p/125677/>Garmin Connect<sup>™</sup> app</a> or to Outdoor Maps+ in the <a href=https://www.garmin.com/p/614327/>Garmin Explore<sup>™</sup> app</a>. Available in select areas. <a href=https://www.garmin.com/garmin-technology/maps-for-smartwatches/garmin-trails/#coverage>Learn more</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MultiBand.svg\"\r\n      title=\"SATIQ<sup>™</sup> TECHNOLOGY\"\r\n      description=\"Optimizes positional accuracy and battery life depending on your needs.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Custom-Truck-Routing.svg\"\r\n      title=\"DYNAMIC ROUND-TRIP ROUTING\"\r\n      description=\"Enter how far you want to go, and get suggested routes that will bring you back. If you break off course, your watch will map a new one that hits the same mileage.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/COMPASS.svg\"\r\n      title=\"ABC SENSORS\"\r\n      description=\"<a href='https://support.garmin.com/en-US/?faq=IX7ZS11c6h17LJVU8YF3g6'>Navigate</a> your next trail with an altimeter, barometer and 3-axis electronic compass.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/GLOBAL.svg\"\r\n      title=\"MULTICONTINENT TOPO MAPS\"\r\n      description=\"TopoActive maps from around the world keep your explorations on track. Download additional maps via Wi-Fi<sup>®</sup> connectivity.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/NEXTFORK-MAP-GUIDE.svg\"\r\n      title=\"NEXTFORK MAP GUIDE\"\r\n      description=\"Navigate with a quick glance, and see the distance to the next intersection and the trail name.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/UP-AHEAD.svg\"\r\n      title=\"UP AHEAD FEATURE\"\r\n      description=\"<a href='https://support.garmin.com/en-US/?faq=lQMibRoY2I5Y4pP8EXgxv7'>Get at-a-glance awareness</a> for selected POI checkpoints ahead — such as aid stations — during a race.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Courses.svg\"\r\n      title=\"COURSES WITH TURN-BY-TURN DIRECTIONS\"\r\n      description=\"Create or find existing courses in the Garmin Connect smart-device app, or sync from your favorite third-party platforms and get turn-by-turn directions.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/SKIVIEW-MAPS.svg\"\r\n      title=\"SKIVIEW<sup>™</sup> MAPS\"\r\n      description=\"View run names and difficulty ratings for more than 2,000 preloaded <a href=https://www.garmin.com/garmin-technology/wearable-maps/resort-ski-maps/>ski resorts</a> worldwide.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/full-color-courseview-maps-tee-hero.svg\"\r\n      title=\"GOLF COURSE MAPS\"\r\n      description=\"Get preloaded full-color <a href=https://www.garmin.com/garmin-technology/wearable-maps/golf-courses/>CourseView maps</a> for more than 43,000 golf courses around the world.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"HEALTH\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MORNING-REPORT.svg\"\r\n      title=\"MORNING REPORT\"\r\n      description=\"Get a customizable overview of your sleep, training outlook, HRV status, weather and more as soon as you wake up.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/EVENING-REPORT.svg\"\r\n      title=\"EVENING REPORT\"\r\n      description=\"Prepare for tomorrow before bed with a reminder of sleep need, tomorrow’s workout, weather and events.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/HRV-STATUS.svg\"\r\n      title=\"HRV STATUS\"\r\n      description=\"Gain a better understanding of your  <a href=https://www.garmin.com/garmin-technology/running-science/#heart-rate-variability>overall health, recovery and training performance</a> while you sleep.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/WristHeartRate.svg\"\r\n      title=\"WRIST-BASED HEART RATE\"\r\n      description=\"The watch constantly samples your <a href=https://www.garmin.com/garmin-technology/health-science/heart-rate-monitoring/>heart rate</a><sup>2</sup> to help you gauge how hard you work during activities.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/30-Second-Recording.svg\"\r\n      title=\"GARMIN ECG APP\"\r\n      description=\"The <a href=https://www.garmin.com/garmin-technology/health-science/ecg/>ECG app</a><sup>3</sup> uses sensors to record the electrical signals that control how your heart beats. It analyzes that recording to detect signs of an irregular heart rhythm called atrial fibrillation (AFib).\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Pulseox.svg\"\r\n      title=\"PULSE OX SENSOR\"\r\n      description=\"Track your <a href=https://www.garmin.com/garmin-technology/health-science/pulse-ox/>blood oxygen saturation</a> while you’re awake or asleep, and gain awareness of how you’re adapting to altitude<sup>4</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/SLEEP-COACH.svg\"\r\n      title=\"SLEEP COACH\"\r\n      description=\"Get a sleep score and personalized coaching for how much sleep you need. Track <a href=https://www.garmin.com/garmin-technology/health-science/sleep-tracking/>sleep stages</a>, and get insights to improve sleep quality<sup>2</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Nap-Detection.svg\"\r\n      title=\"NAP DETECTION\"\r\n      description=\"<a href=https://www.garmin.com/garmin-technology/health-science/nap-detection/>Automatically track or log your naps</a> to see how they benefit your body and to check the recommended time and duration they should be.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BREATHING-VARIATIONS-THROUGHOUT-THE-NIGHT.svg\"\r\n      title=\"BREATHING VARIATIONS\"\r\n      description=\"Track shifts in your breathing patterns as you sleep<sup>4</sup>. These shifts could be related to environment, alcohol or potential sleep disorders such as sleep apnea.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ON-DEVICE-BIKE-BELL.svg\"\r\n      title=\"SMART WAKE ALARM\"\r\n      description=\"The smart wake alarm gently vibrates to wake you at the optimal time.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/jet-lag-advisor.svg\"\r\n      title=\"JET LAG ADVISER\"\r\n      description=\"Help to minimize the effects of <a href=https://www.garmin.com/garmin-technology/health-science/jet-lag-adviser/>jet lag</a> with guidance on light exposure, sleep schedule and exercise.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BodyBattery.svg\"\r\n      title=\"BODY BATTERY<sup>™</sup> ENERGY MONITORING\"\r\n      description=\"Track your body’s <a href=https://www.garmin.com/garmin-technology/health-science/body-battery/>energy levels</a> to find the best times for activity and rest<sup>2</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Health_And_Fitness_Tracking.svg\"\r\n      title=\"STRESS TRACKING\"\r\n      description=\"See if you’re having a calm, balanced or <a href=https://www.garmin.com/garmin-technology/health-science/stress-tracking/>stressful day</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/health-snapshot.svg\"\r\n      title=\"HEALTH SNAPSHOT\"\r\n      description=\"Log a 2-minute session to <a href='https://support.garmin.com/?faq=PB1duL5p6V64IQwhNvcRK9'>record key health stats</a>, then generate a report to share with your healthcare provider.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/respiration.svg\"\r\n      title=\"RESPIRATION TRACKING\"\r\n      description=\"See how you’re <a href=https://www.garmin.com/garmin-technology/health-science/respiration-rate/>breathing</a> throughout the day and night.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/hyrdation.svg\"\r\n      title=\"HYDRATION TRACKING\"\r\n      description=\"<a href=https://www.garmin.com/garmin-technology/health-science/hydration/>Log your daily fluid</a> intake as a reminder to stay hydrated.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/HEAT-AND-ALTITUDE-ACCLIMATION.svg\"\r\n      title=\"ALTITUDE AND HEAT ACCLIMATION\"\r\n      description=\"See <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/heat-and-altitude-acclimation/>how you’re holding</a> up to the current elevation or heat based on your health metrics.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MOVE-ALERTS.svg\"\r\n      title=\"MOBILITY\"\r\n      description=\"Increase your flexibility and strength with downloadable mobility workouts and an activity profile.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"CONNECTIVITY\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Garmin_Connect.svg\"\r\n      title=\"GARMIN CONNECT APP\"\r\n      description=\"See your health and fitness information, connect with friends, and more. The Garmin Connect app is your go-to tool for tracking and sharing your data.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Messaging.svg\"\r\n      title=\"SMART NOTIFICATIONS\"\r\n      description=\"Receive emails, texts and alerts on your smartwatch when paired with your iPhone<sup>®</sup> or Android<sup>™</sup> smartphone.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Music.svg\"\r\n      title=\"MUSIC\"\r\n      description=\"With 64 GB of storage memory, you can download up to 7,000 songs from your Spotify, Deezer or Amazon Music accounts for phone-free listening (subscription may be required).\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Garmin_Pay.svg\"\r\n      title=\"GARMIN PAY<sup>™</sup> CONTACTLESS PAYMENTS\"\r\n      description=\"Breeze through checkout lines or transit systems with <a href=https://www.garmin.com/garminpay/banks/>participating providers</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Share.svg\"\r\n      title=\"GARMIN SHARE\"\r\n      description=\"Use this feature to easily share saved locations, courses and workouts with friends’ compatible Garmin devices.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/assistance.svg\"\r\n      title=\"SAFETY AND TRACKING FEATURES\"\r\n      description=\"If you feel unsafe or if your watch senses that an incident occurred, your watch will <a href=https://www.garmin.com/blog/featured-2/safety-and-tracking-features/>send a message</a> with your live location<sup>5</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/waze.svg\"\r\n      title=\"YOUR LIVE LOCATION IN WAZE\"\r\n      description=\"Drivers using Waze can get alerts for nearby cyclists via <a href=https://www.garmin.com/garmin-technology/cycling-science/>LiveTrack location sharing</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/stocks.svg\"\r\n      title=\"STOCKS TRACKER\"\r\n      description=\"Keep track of up to 50 of your favorite stocks<sup>6</sup> — right from your wrist.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/CONNECT-IQ-STORE.svg\"\r\n      title=\"CONNECT IQ STORE\"\r\n      description=\"Add watch faces, data fields and apps from your paired smartphone.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/power-manager.svg\"\r\n      title=\"POWER MANAGER\"\r\n      description=\"View how various settings and sensors impact your watch’s battery life.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start disclaimer -->\r\n<pc-layout-container\r\n  theme=\"neutral\"\r\n>\r\n  <pc-disclaimer-block>\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"1\"\r\n      content=\"Active plan required; LTE network coverage is not available in all regions. Satellite connection and SOS functionality on this device have important limitations compared to other inReach devices that could affect the performance of connected features, making them unavailable in certain situations. Check <a href=https://www.garmin.com/connectivity/smartwatches/fenix-9-pro/feature-requirements/>Garmin.com/fenix9profeaturerequirements</a> for requirements and limitations and to see which services are accessible in your area — or in areas to where you may be traveling to ensure the performance, coverage, and service levels of this device are suitable for your intended use.\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"2\"\r\n      content=\"<a href=https://www.garmin.com/legal/atdisclaimer/>Activity tracking accuracy</a>\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"3\"\r\n      content=\"The ECG app is only available on select Garmin smartwatches with the latest version of the Garmin Connect smartphone app and watch software. The ECG app is not available in all regions; see <a href=https://www.garmin.com/garmin-technology/health-science/ecg/>Garmin.com/ecg</a> for availability. The ECG app is only intended for adults aged 22 years and over. The ECG app is capable of recording an ECG similar to a Lead I ECG and detecting the presence of atrial fibrillation or normal sinus rhythm.\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"4\"\r\n      content=\"This is not a medical device and is not intended for use in the diagnosis or monitoring of any medical condition; see <a href=https://www.garmin.com/legal/atdisclaimer/>Garmin.com/ataccuracy</a>. Pulse Ox is not available in all countries.\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"5\"\r\n      content=\"When paired with your smartphone; see <a href='https://support.garmin.com/en-US/?faq=pvL8aWsaLU2iKyvF8VrpP9'>Garmin.com/ble</a>. For safety and tracking feature requirements and limitations, see <a href='https://support.garmin.com/en-US/?faq=RfaXahBWkH8Q7pVFLsuUmA'>Garmin.com/safety</a>.\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"6\"\r\n      content=\"When paired with your smartphone. All data provided on the Garmin Stocks Tracker app is provided for informational purposes only and is not intended for trading or investing purposes. See <a href=https://twelvedata.com/stocks>Twelvedata.com/stocks</a> for stock exchanges covered by the Stocks app.\"\r\n    />\r\n  </pc-disclaimer-block>\r\n  <pc-disclaimer-block>\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      content=\"iPhone is a trademark of Apple Inc., registered in the U.S. and other countries. Android is a trademark of Google LLC. SPOTIFY and the Spotify logo are among the registered trademarks of Spotify AB. Amazon Music and all related logos are trademarks of Amazon.com, Inc. or its affiliates.\"\r\n    />\r\n  </pc-disclaimer-block>\r\n</pc-layout-container>\r\n<!-- end disclaimer -->\r\n\r\n</div>"},"inTheBoxTab":{"title":"In the Box","content":"<ul>\r\n\t<li>fēnix 9 Pro smartwatch</li>\r\n\t<li>Charging/data cable</li>\r\n\t<li>Documentation</li>\r\n</ul>\r\n\
