 timer (pool swim only)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Auto rest (pool swim only)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Time and distance alerts</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Pacing alerts (pool swim only)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Countdown start (pool swim only)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Pool swim workouts</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Critical swim speed</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Underwater wrist-based heart rate</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Heart rate from external HRM (real-time during rests, interval and session stats during rests, and automatic heart rate download post-swim)</th><td>yes (with compatible HRM)</td></tr></tbody></table></div>"},"overviewTab":{"title":"Overview","content":"<div><!-- keep this to ensure overview section goes to full width layout -->\r\n<overview-container/>\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-1-D_01.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-1-M_01.jpg\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-1-D_02.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-1-M_02.jpg\"\r\n  text=\"PLAY HARDER\"\r\n  text-size=\"2.3\"\r\n  text-align=\"center\"\r\n  text-position=\"middle\"\r\n  mobile-text-size=\"2.3\"\r\n  mobile-text-align=\"center\"\r\n  mobile-text-position=\"middle\"\r\n  button-text=\"FĒNIX® 9 PRO\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-2-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-2-M.jpg\"\r\n  text=\"<br />UNSTOPPABLE STRENGTH\"\r\n  text-size=\"2.3\"\r\n  text-align=\"right\"\r\n  text-position=\"bottom\"\r\n  mobile-text-size=\"2.3\"\r\n  mobile-text-align=\"center\"\r\n  mobile-text-position=\"top\"\r\n  button-text=\"LIGHTWEIGHT TITANIUM CASE\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04335-25/g/87619-3-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04335-25/g/87619-3-M.jpg\"\r\n  text=\"<br />TELL ONE<br />INCREDIBLE STORY\"\r\n  text-size=\"2.3\"\r\n  text-align=\"left\"\r\n  text-position=\"top\"\r\n  mobile-text-size=\"2.3\"\r\n  mobile-text-align=\"center\"\r\n  mobile-text-position=\"bottom\"\r\n  button-text=\"GROUP ACTIVITiES TOGETHER WITH GARMIN EPIC\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-5-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04336-00/g/87620-5-M.jpg\"\r\n  text=\"<br />SEE THE WAY IN STYLE\"\r\n  text-size=\"2.3\"\r\n  text-align=\"right\"\r\n  text-position=\"top\"\r\n  mobile-text-size=\"2.3\"\r\n  mobile-text-align=\"center\"\r\n  mobile-text-position=\"bottom\"\r\n  button-text=\"SMOOTHER AND MORE  INTUiTIVE ROUTABLE MAPS\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start video-banner -->\r\n<pc-video-banner\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04337-10/g/87620-VID-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04337-10/g/87620-VID-M.jpg\"\r\n  video-link=\"https://www.youtube-nocookie.com/embed/RXkbE5xTTPw\"\r\n  not-youtube=\"false\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end video-banner -->\r\n\r\n<!-- start social-gallery -->\r\n<pc-social-gallery\r\n  data-translate\r\n  heading=\"Show us what you’ve got. Tag @garmin on Instagram.\"\r\n  category-key=\"FENIX 9\"\r\n  product-id=\"1962732\"\r\n  locale=\"en-US\"\r\n/>\r\n<!-- end social-gallery -->\r\n\r\n<!-- start line-divider -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"33\"\r\n    color=\"white\"\r\n  />\r\n</pc-layout-container>\r\n<!-- end line-divider -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-04336-05/g/87559-D-FAN.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-04336-05/g/87559-M-FAN.jpg\"\r\n  theme=\"light\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start overview-intro -->\r\n<pc-overview-intro\r\n  data-translate\r\n  title=\"PREMIUM PERFORMANCE, TITANIUM STRONG\"\r\n  title-heading=\"h2\"\r\n  title-align=\"center\"\r\n  description=\"Built for serious athletes and adventurers, this premium multisport GPS smartwatch has a durable titanium case and a bright AMOLED display. It features enhanced stamina and endurance tracking plus smoother, more intuitive routable maps.\"\r\n  description-size=\"large\"\r\n  description-align=\"center\"\r\n  theme=\"light\"\r\n>\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Titanium.svg\"\r\n    img-width=\"50px\"\r\n    description=\"DURABLE AND LIGHTWEIGHT TITANIUM WATCH CASE\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Battery_Life.svg\"\r\n    img-width=\"50px\"\r\n    description=\"UP TO 18 DAYS OF BATTERY LIFE IN SMARTWATCH MODE\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/TRAINING-GUIDANCE.svg\"\r\n    img-width=\"50px\"\r\n    description=\"ADVANCED TRAINING AND PERFORMANCE FEATURES\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Heart_Rate_Sensors.svg\"\r\n    img-width=\"50px\"\r\n    description=\"24/7 HEALTH AND WELLNESS FEATURES\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/flashlight.svg\"\r\n    img-width=\"50px\"\r\n    description=\"LED FLASHLIGHT WITH DIMMABLE WHITE, RED OR GREEN ILLUMINATION\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Text-And-Voice-Messaging.svg\"\r\n    img-width=\"50px\"\r\n    description=\"SPEAKER AND MICROPHONE FOR VOICE MESSAGING<sup>1</sup> AND CONTROL\"\r\n  />\r\n</pc-overview-intro>\r\n<!-- end overview-intro -->\r\n\r\n</div><div><!-- start headline -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-column-layout\r\n    columns=\"1\"\r\n  >\r\n    <pc-headline\r\n      data-translate\r\n      primary-text=\"WHAT YOU'LL LOVE\"\r\n      padding-top=\"3\"\r\n      padding-bottom=\"3\"\r\n      text-size=\"2.6\"\r\n      mobile-text-size=\"2.4\"\r\n      text-align=\"center\"\r\n      mobile-text-align=\"center\"\r\n      theme=\"dark\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end headline -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04336-05/g/87559-1.jpg\"\r\n      title=\"RUGGED TITANIUM DESIGN\"\r\n      description=\"Crafted to endure, this watch has a 1.4-inch AMOLED display with up to 3,000 nits of brightness — plus a scratch-resistant sapphire lens, leakproof metal buttons, integrated LED flashlight and the first-ever titanium fēnix watch case for lightweight comfort and durability. It’s also dive-rated and tested to U.S. military standards for thermal, shock and water resistance.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04336-05/g/87559-2.jpg\"\r\n      title=\"ADVANCED TRAINING TOOLS\"\r\n      description=\"Access more than 100 activity profiles plus advanced training and performance tools. Enhanced stamina metrics show how your endurance is changing based on your fitness gains and training history.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04336-05/g/87559-3.jpg\"\r\n      title=\"FIND YOUR WAY\"\r\n      description=\"Multicontinent <a href=https://www.garmin.com/Support/FAQ/TopoActiveMaps>TopoActive maps</a> are smoother and more intuitive, offering advanced navigational tools such as dynamic round-trip routing, NextFork<sup>™</sup> map guide, grade-adjusted running pace and more.\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04336-05/g/87559-4.jpg\"\r\n      title=\"ENGINEERED FOR MORE\"\r\n      description=\"A built-in speaker and microphone allow you to make and take calls from your wrist when your watch is paired to your smartphone. Record voice notes and use your smartphone’s voice assistant to respond to text messages and more.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04336-05/g/87559-5.jpg\"\r\n      title=\"GARMIN EPIC\"\r\n      description=\"This <a href=https://www.garmin.com/garmin-technology/maps-for-smartwatches/garmin-epic/>feature</a> lets you record, relive and share multiple days of activities with photos, as well as health and performance stats, in a cohesive story of events over time.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-04336-05/g/87559-6.jpg\"\r\n      title=\"24/7 HEALTH AND WELLNESS\"\r\n      description=\"Features such as HRV status give insights into how your body may be recovering, while sleep coach suggests how to improve your sleep so you can perform at your best.\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"PERFORMANCE\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/real-time-staminia.svg\"\r\n      title=\"STAMINA METRICS\"\r\n      description=\"This <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/real-time-stamina/>feature</a> helps you visualize the impact of your endurance training based on your fitness gains and training history.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/TRAINING-READINESS.svg\"\r\n      title=\"TRAINING READINESS\"\r\n      description=\"From the moment you wake up, get a <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/training-readiness/>readiness score</a> based on your sleep quality<sup>2</sup>, recovery, training load and more, so you can determine if it’s a good day to go hard — or take it easy.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/training-status.svg\"\r\n      title=\"TRAINING STATUS\"\r\n      description=\"Get <a href=https://www.garmin.com/garmin-technology/running-science/#training-status>insight</a>, and know whether you’re training productively, peaking or strained.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Garmin_Coach.svg\"\r\n      title=\"GARMIN COACH\"\r\n      description=\"Reach your goals with <a href=https://www.garmin.com/garmin-coach/overview/>Garmin Coach</a> training plans for running, cycling, strength and fitness; some even adapt based on your health and fitness metrics.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Race-Predictor.svg\"\r\n      title=\"VISUAL RACE PREDICTOR\"\r\n      description=\"Get an <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/race-time-prediction/>estimate of what your pace could be</a> for a 5K, 10K, half marathon and marathon.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Dynamic_PacePro.svg\"\r\n      title=\"PACEPRO<sup>™</sup> TECHNOLOGY\"\r\n      description=\"Plan <a href=https://www.garmin.com/garmin-technology/wearable-maps/pacepro/>race-day strategy</a> with GPS-based pace guidance for a selected course or distance.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Simulate_Inclines.svg\"\r\n      title=\"CLIMBPRO FEATURE\"\r\n      description=\"See <a href=https://www.garmin.com/garmin-technology/cycling-science/physiological-measurements/climbpro/>real-time information</a> on your current and upcoming climbs on downloaded courses.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/GRADE-ADJUSTED-PACE.svg\"\r\n      title=\"GRADE-ADJUSTED ROLLING PACE\"\r\n      description=\"Get a continually updated average pace with grade adjustments.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Measure_Data.svg\"\r\n      title=\"PERFORMANCE METRICS\"\r\n      description=\"Gauge your performance with advanced training metrics such as <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/vo2-max/>VO2 max</a>, training load and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ENDURANCE-SCORE.svg\"\r\n      title=\"ENDURANCE SCORE\"\r\n      description=\"Measuring your ability to <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/endurance-score/>sustain prolonged efforts</a>, this feature helps you see how training from your athletic pursuits impacts your overall endurance.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/HILL-SCORE.svg\"\r\n      title=\"HILL SCORE\"\r\n      description=\"Measure your capability for <a href=https://www.garmin.com/garmin-technology/running-science/running-dynamics/hill-score/>running uphill</a>, and evaluate your progress over time based on your VO2 max and training history.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Workout-Recommendations_Daily-Workout-Suggestions.svg\"\r\n      title=\"DAILY SUGGESTED WORKOUTS\"\r\n      description=\"View your entire week of <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/daily-suggested-workouts-feature/>daily suggested workouts</a>, which adapt after every run or ride.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/recovery-time.svg\"\r\n      title=\"RECOVERY TIME\"\r\n      description=\"Know <a href='https://support.garmin.com/en-US/?faq=8ImmxVkZMh4EYYq5Zp2bR8'>how long you need to recover</a> before your next high-effort workout based on your latest training.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/wrist-based-running-dynamics.svg\"\r\n      title=\"WRIST-BASED RUNNING DYNAMICS\"\r\n      description=\"View crucial running metrics such as cadence, stride length, ground contact time and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/RUNNING-ECONOMY.svg\"\r\n      title=\"RUNNING ECONOMY\"\r\n      description=\"Measure your overall energy efficiency while running — using long-term running volume, stride length and step speed loss — when you pair your watch with the <a href=https://www.garmin.com/p/1473393/>HRM 600</a> monitor (sold separately).\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/RUNNING-TOLERANCE.svg\"\r\n      title=\"RUNNING TOLERANCE\"\r\n      description=\"Better understand the impact each run has on your body, and get a recommended weekly maximum mileage so you can keep training effectively without taking on too much.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/STEP-SPEED-LOSS.svg\"\r\n      title=\"STEP SPEED LOSS\"\r\n      description=\"Improve your running form, and understand how much you slow down when your foot hits the ground when you pair your watch with the <a href=https://www.garmin.com/p/1473393/>HRM 600</a> monitor (sold separately).\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Real-time.svg\"\r\n      title=\"PROJECTED RACE TIME\"\r\n      description=\"This race-time prediction is what your race time and pace could be if you keep training well all the way through to the race date entered.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"ACTIVITIES\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/track-fitness.svg\"\r\n      title=\"TRACK YOUR ACTIVITIES\"\r\n      description=\"Use preloaded activity profiles to get data and insight from your active pursuits. Even track team sport activities such as soccer, football, racquet sports and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/LIFESTYLE.svg\"\r\n      title=\"TRIATHLON AND MULTISPORT PROFILES\"\r\n      description=\"Automatically record splits with built-in profiles for triathlons, duathlons, brick workouts and swim/runs, or you can create your own.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/cross-training.svg\"\r\n      title=\"CROSS-TRAINING\"\r\n      description=\"Download the free HIIT, strength, cardio, yoga, Pilates and mobility workouts so you can switch up how you sweat.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/On-screen_workouts.svg\"\r\n      title=\"ANIMATED WORKOUTS\"\r\n      description=\"Follow animated workouts for cardio, strength, yoga and Pilates on the watch screen.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BACKCOUNTRY-SKI-AND-SNOWBOARD.svg\"\r\n      title=\"BACKCOUNTRY SKI AND SNOWBOARD\"\r\n      description=\"Automatically track ascents and descents along with how much time you spend between runs.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Multiple-Dive-Modes.svg\"\r\n      title=\"RECREATIONAL DIVING\"\r\n      description=\"A 40-meter dive rating and leakproof metal buttons let you reach new depths with support for scuba and apnea dive activities.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/surf.svg\"\r\n      title=\"SURF ACTIVITY\"\r\n      description=\"Record waves surfed, maximum speed reached, distance traveled and more. Use <a href=https://www.surfline.com/lp/garmin-sessions>Surfline Sessions</a><sup>™</sup> technology to capture video of waves you ride in front of a Surfline<sup>®</sup> camera.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/advanced-swim-metrics.svg\"\r\n      title=\"ADVANCED SWIM METRICS\"\r\n      description=\"Swim smarter with metrics like swolf to track efficiency, stroke type, pace and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MTB-DYNAMICS---MOUNTAIN-BIKE-DYNAMICS.svg\"\r\n      title=\"MTB DYNAMICS\"\r\n      description=\"Track the details of your ride with specialized  <a href=https://www.garmin.com/garmin-technology/cycling-science/mtb-dynamics/grit/>Grit</a><sup>®</sup> and <a href=https://www.garmin.com/garmin-technology/cycling-science/mtb-dynamics/flow/>Flow</a><sup>™</sup> measurements.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ROWING-ACTIVITY.svg\"\r\n      title=\"ROWING ACTIVITY\"\r\n      description=\"Record indoor or outdoor <a href=https://www.garmin.com/garmin-technology/rowing-science/>rowing</a> workouts. For indoor, VO2 max helps gauge cardio fitness and training impact (requires a power meter-equipped rowing machine).\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/RUCKING-ACTIVITY.svg\"\r\n      title=\"RUCKING ACTIVITY\"\r\n      description=\"Set a target metric, create a custom workout, and change pack weight during the <a href=https://www.garmin.com/garmin-technology/rucking-science/>activity</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ARCHERYX.svg\"\r\n      title=\"ARCHERYX\"\r\n      description=\"Advanced shot timing and aiming metrics give archers real-time data and analysis to help improve their precision and accuracy.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"NAVIGATION\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Outdoor-Maps.svg\"\r\n      title=\"OUTDOOR MAPS+\"\r\n      description=\"Get an <a href=https://www.garmin.com/p/893561>Outdoor Maps+</a> plan for premium mapping content, such as satellite imagery and enhanced topographic maps. More memory capacity means the fēnix 9 Pro smartwatch can download and store twice as many maps from Outdoor Maps+ as previous fēnix versions.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/GARMIN-TRAILS.svg\"\r\n      title=\"GARMIN TRAILS\"\r\n      description=\"Access thousands of trails, and send them directly to your compatible device for offline use with a <a href=https://www.garmin.com/p/1565777/pn/010-D2234-SU/>Garmin Connect+</a> plan in the <a href=https://www.garmin.com/p/125677/>Garmin Connect<sup>™</sup> app</a> or to Outdoor Maps+ in the <a href=https://www.garmin.com/p/614327/>Garmin Explore<sup>™</sup> app</a>. Available in select areas. <a href=https://www.garmin.com/garmin-technology/maps-for-smartwatches/garmin-trails/#coverage>Learn more</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MultiBand.svg\"\r\n      title=\"SATIQ<sup>™</sup> TECHNOLOGY\"\r\n      description=\"Optimizes positional accuracy and battery life depending on your needs.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Custom-Truck-Routing.svg\"\r\n      title=\"DYNAMIC ROUND-TRIP ROUTING\"\r\n      description=\"Enter how far you want to go, and get suggested routes that will bring you back. If you break off course, your watch will map a new one that hits the same mileage.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/COMPASS.svg\"\r\n      title=\"ABC SENSORS\"\r\n      description=\"<a href='https://support.garmin.com/en-US/?faq=IX7ZS11c6h17LJVU8YF3g6'>Navigate</a> your next trail with an altimeter, barometer and 3-axis electronic compass.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/GLOBAL.svg\"\r\n      title=\"MULTICONTINENT TOPO MAPS\"\r\n      description=\"TopoActive maps from around the world keep your explorations on track. Download additional maps via Wi-Fi<sup>®</sup> connectivity.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/NEXTFORK-MAP-GUIDE.svg\"\r\n      title=\"NEXTFORK MAP GUIDE\"\r\n      description=\"Navigate with a quick glance, and see the distance to the next intersection and the trail name.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/UP-AHEAD.svg\"\r\n      title=\"UP AHEAD FEATURE\"\r\n      description=\"<a href='https://support.garmin.com/en-US/?faq=lQMibRoY2I5Y4pP8EXgxv7'>Get at-a-glance awareness</a> for selected POI checkpoints ahead — such as aid stations — during a race.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Courses.svg\"\r\n      title=\"COURSES WITH TURN-BY-TURN DIRECTIONS\"\r\n      description=\"Create or find existing courses in the Garmin Connect smart-device app, or sync from your favorite third-party platforms and get turn-by-turn directions.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/SKIVIEW-MAPS.svg\"\r\n      title=\"SKIVIEW<sup>™</sup> MAPS\"\r\n      description=\"View run names and difficulty ratings for more than 2,000 preloaded <a href=https://www.garmin.com/garmin-technology/wearable-maps/resort-ski-maps/>ski resorts</a> worldwide.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/full-color-courseview-maps-tee-hero.svg\"\r\n      title=\"GOLF COURSE MAPS\"\r\n      description=\"Get preloaded full-color <a href=https://www.garmin.com/garmin-technology/wearable-maps/golf-courses/>CourseView maps</a> for more than 43,000 golf courses around the world.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"HEALTH\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MORNING-REPORT.svg\"\r\n      title=\"MORNING REPORT\"\r\n      description=\"Get a customizable overview of your sleep, training outlook, HRV status, weather and more as soon as you wake up.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/EVENING-REPORT.svg\"\r\n      title=\"EVENING REPORT\"\r\n      description=\"Prepare for tomorrow before bed with a reminder of sleep need, tomorrow’s workout, weather and events.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/HRV-STATUS.svg\"\r\n      title=\"HRV STATUS\"\r\n      description=\"Gain a better understanding of your  <a href=https://www.garmin.com/garmin-technology/running-science/#heart-rate-variability>overall health, recovery and training performance</a> while you sleep.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/WristHeartRate.svg\"\r\n      title=\"WRIST-BASED HEART RATE\"\r\n      description=\"The watch constantly samples your <a href=https://www.garmin.com/garmin-technology/health-science/heart-rate-monitoring/>heart rate</a><sup>2</sup> to help you gauge how hard you work during activities.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/30-Second-Recording.svg\"\r\n      title=\"GARMIN ECG APP\"\r\n      description=\"The <a href=https://www.garmin.com/garmin-technology/health-science/ecg/>ECG app</a><sup>3</sup> uses sensors to record the electrical signals that control how your heart beats. It analyzes that recording to detect signs of an irregular heart rhythm called atrial fibrillation (AFib).\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Pulseox.svg\"\r\n      title=\"PULSE OX SENSOR\"\r\n      description=\"Track your <a href=https://www.garmin.com/garmin-technology/health-science/pulse-ox/>blood oxygen saturation</a> while you’re awake or asleep, and gain awareness of how you’re adapting to altitude<sup>4</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/SLEEP-COACH.svg\"\r\n      title=\"SLEEP COACH\"\r\n      description=\"Get a sleep score and personalized coaching for how much sleep you need. Track <a href=https://www.garmin.com/garmin-technology/health-science/sleep-tracking/>sleep stages</a>, and get insights to improve sleep quality<sup>2</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Nap-Detection.svg\"\r\n      title=\"NAP DETECTION\"\r\n      description=\"<a href=https://www.garmin.com/garmin-technology/health-science/nap-detection/>Automatically track or log your naps</a> to see how they benefit your body and to check the recommended time and duration they should be.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BREATHING-VARIATIONS-THROUGHOUT-THE-NIGHT.svg\"\r\n      title=\"BREATHING VARIATIONS\"\r\n      description=\"Track shifts in your breathing patterns as you sleep<sup>4</sup>. These shifts could be related to environment, alcohol or potential sleep disorders such as sleep apnea.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ON-DEVICE-BIKE-BELL.svg\"\r\n      title=\"SMART WAKE ALARM\"\r\n      description=\"The smart wake alarm gently vibrates to wake you at the optimal time.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/jet-lag-advisor.svg\"\r\n      title=\"JET LAG ADVISER\"\r\n      description=\"Help to minimize the effects of <a href=https://www.garmin.com/garmin-technology/health-science/jet-lag-adviser/>jet lag</a> with guidance on light exposure, sleep schedule and exercise.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BodyBattery.svg\"\r\n      title=\"BODY BATTERY<sup>™</sup> ENERGY MONITORING\"\r\n      description=\"Track your body’s <a href=https://www.garmin.com/garmin-technology/health-science/body-battery/>energy levels</a> to find the best times for activity and rest<sup>2</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Health_And_Fitness_Tracking.svg\"\r\n      title=\"STRESS TRACKING\"\r\n      description=\"See if you’re having a calm, balanced or <a href=https://www.garmin.com/garmin-technology/health-science/stress-tracking/>stressful day</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/health-snapshot.svg\"\r\n      title=\"HEALTH SNAPSHOT\"\r\n      description=\"Log a 2-minute session to <a href='https://support.garmin.com/?faq=PB1duL5p6V64IQwh
