min-helps-you-run-safely/>If you need assistance</a>, you can manually send a message<sup>8</sup> with your live location to your preloaded contacts.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/sports-score.svg\"\r\n      title=\"SPORTS SCORES\"\r\n      description=\"Live data, schedules and standings for 15 different sports leagues when paired to your smartphone.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Share.svg\"\r\n      title=\"GARMIN SHARE\"\r\n      description=\"Easily share saved locations, courses and workouts with friends’ compatible Garmin devices.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Google-Maps.svg\"\r\n      title=\"GOOGLE MAPS<sup>™</sup> APP\"\r\n      description=\"Know where to go when walking, running or cycling. Enter your destination in Google Maps on your Android<sup>™</sup> smartphone, then follow turn-by-turn directions on your wrist.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"CONVENIENCE\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/WATCH-FACE-EDITOR.svg\"\r\n      title=\"WATCH FACE CUSTOMIZATION\"\r\n      description=\"Choose from various watch faces with customizable data   and color health-science/heart-rate-monitoring/'>Heart rate</a> (constant, every second)</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\"><a href='https://www.garmin.com/en-US/garmin-technology/health-science/heart-rate-monitoring/'>Resting heart rate</a></th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\"><a href='https://www.garmin.com/en-US/garmin-technology/health-science/heart-rate-monitoring/'>Abnormal heart rate alerts</a></th><td>yes (high and low)</td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\"><a href='https://www.garmin.com/en-US/garmin-technology/health-science/respiration-rate/'>Respiration rate</a></th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\"><a href='https://www.garmin.com/en-US/garmin-technology/health-science/fitness-age/'>Fitness age</a></th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\"><a href='https://www.garmin.com/garmin-technology/health-science/body-battery/'>Body Battery™ energy monitor</a></th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\"><a href='https://www.garmin.com/en-US/garmin-technology/health-science/stress-tracking/'>All-day stress</a></th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Relaxation reminders</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\"><a href='https://www.garmin.com/en-US/garmin-technology/health-science/respiration-rate/'>Relaxation breathing timer</a></th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Meditation</th><td ube-nocookie.com/embed/G9LZgkrKj7U\"\r\n  not-youtube=\"false\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end video-banner -->\r\n\r\n<!-- start social-gallery -->\r\n<pc-social-gallery\r\n  data-translate\r\n  heading=\"Show us what you’ve got. Tag @garmin on Instagram.\"\r\n  category-key=\"Venu 4\"\r\n  product-id=\"1614061\"\r\n  locale=\"en-US\"\r\n/>\r\n<!-- end social-gallery -->\r\n\r\n<!-- start line-divider -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"33\"\r\n    color=\"white\"\r\n  />\r\n</pc-layout-container>\r\n<!-- end line-divider -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-Family-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-Family-M.jpg\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start overview-intro -->\r\n<pc-overview-intro\r\n  data-translate\r\n  title=\"DISCOVER A HEALTHIER YOU\"\r\n  title-heading=\"h2\"\r\n  title-align=\"center\"\r\n  description=\"Purpose-built with advanced health and fitness features, the Venu 4 smartwatch is your on-wrist support to help you better understand your body and make healthier decisions.\"\r\n  description-size=\"large\"\r\n  description-align=\"center\"\r\n  theme=\"light\"\r\n>\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/AMOLED_Display.svg\"\r\n    img-width=\"50px\"\r\n    description=\"BRIGHT, COLORFUL 1.4-INCH AMOLED DISPLAY\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Battery_Life.svg\"\r\n    img-width=\"50px\"\r\n    description=\"UP TO 12 DAYS OF BATTERY LIFE IN SMARTWATCH MODE\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Health-And-Fitness-Monitoring.svg\"\r\n    img-width=\"50px\"\r\n    description=\"ADVANCED HEALTH AND FITNESS FEATURES\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/LIGHTWEIGHT-2.svg\"\r\n    img-width=\"50px\"\r\n    description=\"LIGHTWEIGHT 45 MM CASE WITH  METAL DESIGN\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Garmin_Connect.svg\"\r\n    img-width=\"50px\"\r\n    description=\"WORKS WITH THE GARMIN CONNECT<sup>™</sup> APP ON iPHONE<sup>®</sup> AND ANDROID<sup>™</sup> SMARTPHONES\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/FLASHLIGHT.svg\"\r\n    img-width=\"50px\"\r\n    description=\"BRIGHT LED FLASHLIGHT\"\r\n  />\r\n</pc-overview-intro>\r\n<!-- end overview-intro -->\r\n\r\n</div><div><!-- start headline -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-column-layout\r\n    columns=\"1\"\r\n  >\r\n    <pc-headline\r\n      data-translate\r\n      primary-text=\"WHAT YOU'LL LOVE\"\r\n      padding-top=\"3\"\r\n      padding-bottom=\"3\"\r\n      text-size=\"2.6\"\r\n      mobile-text-size=\"2.4\"\r\n      text-align=\"center\"\r\n      mobile-text-align=\"center\"\r\n      theme=\"dark\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end headline -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-1-HEALTH-MONITORING.jpg\"\r\n      title=\"24/7 HEALTH MONITORING\"\r\n      description=\"Make improvements toward a healthier lifestyle with extensive health monitoring features, such as <a href=https://www.garmin.com/garmin-technology/health-science/body-battery/>Body Battery<sup>™</sup> energy monitoring</a>, <a href=https://www.garmin.com/garmin-technology/health-science/stress-tracking/>stress</a>, <a href=https://www.garmin.com/garmin-technology/health-science/pulse-ox/>Pulse Ox</a><sup>1</sup> and <a href=https://www.garmin.com/garmin-technology/health-science/womens-health/>women’s health tracking</a> — including past ovulation estimates<sup>2</sup>   — and more<sup>3</sup>.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-2-SLEEP-TRACKING.jpg\"\r\n      title=\"ADVANCED SLEEP TRACKING\"\r\n      description=\"Get a <a href=https://www.garmin.com/garmin-technology/health-science/sleep-tracking/>sleep score</a> and <a href=https://www.garmin.com/garmin-technology/health-science/sleep-coach/>personalized coaching</a> for how much sleep you need and how you can improve. Even keep track of different sleep stages and <a href=https://www.garmin.com/garmin-technology/health-science/nap-detection/>naps</a> — and see key metrics, such as <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/hrv/>HRV status</a> and skin temperature<sup>3</sup>, to better understand your health. Plus, with the sleep alignment feature, see how aligned you are to your circadian rhythm and see your sleep consistency.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-3-HEALTH-STATUS.jpg\"\r\n      title=\"HEALTH STATUS\"\r\n      description=\"See whether your health metrics — such as heart rate, HRV, skin temperature<sup>3</sup> and Pulse Ox<sup>1</sup> while sleeping — are trending away from your usual range, which could indicate added stress to your body. These changes could be related to physical activity levels, environment, stress, alcohol intake, potential illness, and more.\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-4-WORKOUT-OPTIONS.jpg\"\r\n      title=\"WORKOUT OPTIONS\"\r\n      description=\"Track all the ways you move with more than 80 preloaded GPS and indoor sports apps — including walking, running and more. Reach your goals with <a href=https://connect.garmin.com/features/coach/>Garmin Coach</a> training plans for running, cycling, strength and fitness; some even adapt based on your health and fitness metrics. Or get daily suggested workouts made specifically for you.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-5-LIFESTYLE-LOGGING.jpg\"\r\n      title=\"LIFESTYLE LOGGING\"\r\n      description=\"Log custom or preset behaviors — such as caffeine and alcohol intake — and view reports on how those lifestyle choices impact your sleep, stress and HRV<sup>3</sup> in the <a href=https://www.garmin.com/p/125677>Garmin Connect app</a>. That way, you can make more health-conscious decisions.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-6-EVERYDAY-UTILITY.jpg\"\r\n      title=\"EVERYDAY UTILITY\"\r\n      description=\"A bright LED flashlight provides convenient illumination when you need it. Make and take phone calls from your wrist when your watch is paired to your smartphone. You can even control watch functions with voice commands — or use your smartphone’s voice assistant to respond to text messages and more.\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start headline -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-column-layout\r\n    columns=\"1\"\r\n  >\r\n    <pc-headline\r\n      data-translate\r\n      primary-text=\"SUPPORT YOUR EVERY GOAL\"\r\n      padding-top=\"3\"\r\n      padding-bottom=\"3\"\r\n      text-size=\"2.6\"\r\n      mobile-text-size=\"2.4\"\r\n      text-align=\"center\"\r\n      mobile-text-align=\"center\"\r\n      theme=\"dark\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end headline -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"HEALTH\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BodyBattery.svg\"\r\n      title=\"BODY BATTERY ENERGY MONITORING\"\r\n      description=\"See your energy levels throughout the day, so you’ll know when your body is charged up or needs to rest.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/HRV-STATUS.svg\"\r\n      title=\"HRV STATUS\"\r\n      description=\"Gain a deeper understanding of your overall health through heart rate variability while you sleep.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/30-Second-Recording.svg\"\r\n      title=\"GARMIN ECG APP\"\r\n      description=\"The <a href=https://www.garmin.com/garmin-technology/health-science/ecg/>ECG app</a><sup>4</sup> uses sensors to record the electrical signals that control how your heart beats. It analyzes that recording to detect signs of an irregular heart rhythm called atrial fibrillation  (AFIb).\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ON-DEVICE-BIKE-BELL.svg\"\r\n      title=\"SMART WAKE ALARM\"\r\n      description=\"Wake up more refreshed. The smart wake alarm gently wakes you at the optimal time.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MORNING-REPORT.svg\"\r\n      title=\"MORNING REPORT\"\r\n      description=\"Receive and customize an overview of your sleep, recovery, daily calendar, HRV status and more as soon as you wake up.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/EVENING-REPORT.svg\"\r\n      title=\"EVENING REPORT\"\r\n      description=\"Prepare for tomorrow before bed with a reminder of sleep need, tomorrow’s workout, weather and events.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/WristHeartRate.svg\"\r\n      title=\"WRIST-BASED HEART RATE\"\r\n      description=\"The watch constantly samples your heart rate, including high and low heart rate alerts<sup>3</sup> based on your specific levels.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MCT.svg\"\r\n      title=\"WOMEN’S HEALTH TRACKING\"\r\n      description=\"Track your menstrual cycle or pregnancy, plus get exercise and nutrition education. With skin temperature tracking while you sleep, get better period predictions and past ovulation estimates<sup>2</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/NUTRITION-IN-GARMIN-CONNECT.svg\"\r\n      title=\"NUTRITION IN THE GARMIN CONNECT<sup>™</sup> APP\"\r\n      description=\"Easily track calories and macronutrients, get personalized nutrition recommendations and see reports to follow your progress toward your goals with a <a href=https://www.garmin.com/p/1565777/>Garmin Connect+ plan</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/health-snapshot.svg\"\r\n      title=\"HEALTH SNAPSHOT\"\r\n      description=\"Log a 2-minute session to <a href='https://support.garmin.com/?faq=PB1duL5p6V64IQwhNvcRK9'>record key health stats</a>, then generate a report to share with your health care provider.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BREATHING-VARIATIONS-THROUGHOUT-THE-NIGHT.svg\"\r\n      title=\"BREATHING VARIATIONS\"\r\n      description=\"For a closer glimpse of your health, the breathing variations feature helps you understand shifts in your breathing patterns as you sleep<sup>5</sup>. These shifts could be related to environment, alcohol or potential sleep disorders such as sleep apnea.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Meditation.svg\"\r\n      title=\"MEDITATION\"\r\n      description=\"Help reduce stress, anxiety and more with voice-guided meditation practices.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/jet-lag-advisor.svg\"\r\n      title=\"JET LAG ADVISER\"\r\n      description=\"Help minimize the effects of <a href=https://www.garmin.com/garmin-technology/health-science/body-battery/>jet lag</a> with guidance on light exposure, sleep schedule and exercise.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"FITNESS\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/recovery-time.svg\"\r\n      title=\"WORKOUT BENEFIT AND RECOVERY TIME\"\r\n      description=\"Better understand how each workout affects your body and how much time you need to recover.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/TRAINING-READINESS.svg\"\r\n      title=\"TRAINING READINESS\"\r\n      description=\"Wake up and get a <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/training-readiness/>readiness score</a> based on your sleep quality, recovery and more, so you can determine whether to go hard or take it easy.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/training-status.svg\"\r\n      title=\"TRAINING STATUS\"\r\n      description=\"Get <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/training-status/>insight</a> into training effectiveness, and know whether you’re training productively, peaking or strained.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Fitness-Age.svg\"\r\n      title=\"FITNESS AGE\"\r\n      description=\"Estimate <a href=https://www.garmin.com/garmin-technology/health-science/fitness-age/>how fit you are</a> compared to your actual age.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Wheelchair-Mode.svg\"\r\n      title=\"WHEELCHAIR MODE\"\r\n      description=\"Track your daily pushes<sup>3</sup>, plus get .garmin.com/en/products/010-03014-00/g/77926-M-5.jpg\"\r\n  text=\"<br /><br /><br /><br /><br /><br /><br />PUSH YOUR PASSIONS\"\r\n  text-size=\"2.4\"\r\n  text-align=\"left\"\r\n  text-position=\"middle\"\r\n  mobile-text-size=\"2.0\"\r\n  mobile-text-align=\"center\"\r\n  mobile-text-position=\"bottom\"\r\n  button-text=\"80+ SPORTS APPS, GARMIN COACH, DOWNLOADABLE WORKOUTS AND MORE\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-03014-00/g/77926-D-6-1.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-03014-00/g/77926-M-6-1.jpg\"\r\n  text=\"<br /><br />STRETCH OUT CHARGES\"\r\n  text-size=\"2.3\"\r\n  text-align=\"left\"\r\n  text-position=\"top\"\r\n  mobile-text-size=\"2.0\"\r\n  mobile-text-align=\"center\"\r\n  mobile-text-position=\"top\"\r\n  button-text=\"UP TO 10 DAYS OF BATTERY LIFE IN SMARTWATCH MODE\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start video-banner -->\r\n<pc-video-banner\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-03014-00/g/77930-D-VID.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-03014-00/g/77930-M-VID.jpg\"\r\n  video-link=\"https://www.youtube-nocookie.com/embed/G9LZgkrKj7U\"\r\n  not-youtube=\"false\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end video-banner -->\r\n\r\n<!-- start social-gallery -->\r\n<pc-social-gallery\r\n  data-translate\r\n  heading=\"Show us what you’ve got. Tag @garmin on Instagram.\"\r\n  category-key=\"Venu 4\"\r\n  product-id=\"1613801\"\r\n  locale=\"en-US\"\r\n/>\r\n<!-- end social-gallery -->\r\n\r\n<!-- start line-divider -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"33\"\r\n    color=\"white\"\r\n  />\r\n</pc-layout-container>\r\n<!-- end line-divider -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-03013-00/g/77926-Family-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-03013-00/g/77926-Family-M.jpg\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start overview-intro -->\r\n<pc-overview-intro\r\n  data-translate\r\n  title=\"DISCOVER A HEALTHIER YOU\"\r\n  title-heading=\"h2\"\r\n  title-align=\"center\"\r\n  description=\"Purpose-built with advanced health and fitness features, the Venu 4 GPS smartwatch is your on-wrist support to help you better understand your body and make healthier decisions.\"\r\n  description-size=\"large\"\r\n  description-align=\"center\"\r\n  theme=\"light\"\r\n>\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/AMOLED_Display.svg\"\r\n    img-width=\"50px\"\r\n    description=\"BRIGHT, COLORFUL 1.2-INCH AMOLED DISPLAY\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Battery_Life.svg\"\r\n    img-width=\"50px\"\r\n    description=\"UP TO 10 DAYS OF BATTERY LIFE IN SMARTWATCH MODE\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Health-And-Fitness-Monitoring.svg\"\r\n    img-width=\"50px\"\r\n    description=\"ADVANCED HEALTH AND FITNESS FEATURES\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/LIGHTWEIGHT-2.svg\"\r\n    img-width=\"50px\"\r\n    description=\"LIGHTWEIGHT 41 MM CASE WITH  METAL DESIGN\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Garmin_Connect.svg\"\r\n    img-width=\"50px\"\r\n    description=\"WORKS WITH THE GARMIN CONNECT<sup>™</sup> APP ON iPHONE<sup>®</sup> AND ANDROID<sup>™</sup> SMARTPHONES\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/FLASHLIGHT.svg\"\r\n    img-width=\"50px\"\r\n    description=\"BRIGHT LED FLASHLIGHT\"\r\n  />\r\n</pc-overview-intro>\r\n<!-- end overview-intro -->\r\n\r\n</div><div><!-- start headline -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-column-layout\r\n    columns=\"1\"\r\n  >\r\n    <pc-headline\r\n      data-translate\r\n      primary-text=\"WHAT YOU'LL LOVE\"\r\n      padding-top=\"3\"\r\n      padding-bottom=\"3\"\r\n      text-size=\"2.6\"\r\n      mobile-text-size=\"2.4\"\r\n      text-align=\"center\"\r\n      mobile-text-align=\"center\"\r\n      theme=\"dark\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end headline -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03013-00/g/77926-1-HEALTH-MONITORING.jpg\"\r\n      title=\"24/7 HEALTH MONITORING\"\r\n      description=\"Make improvements toward a healthier lifestyle with extensive health monitoring features, such as <a href=https://www.garmin.com/garmin-technology/health-science/body-battery/>Body Battery<sup>™</sup> energy monitoring</a>, <a href=https://www.garmin.com/garmin-technology/health-science/stress-tracking/>stress</a>, <a href=https://www.garmin.com/garmin-technology/health-science/pulse-ox/>Pulse Ox</a><sup>1</sup> and <a href=https://www.garmin.com/garmin-technology/health-science/womens-health/>women’s health tracking</a> — including past ovulation estimates<sup>2</sup>   — and more<sup>3</sup>.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03013-00/g/77926-2-SLEEP-TRACKING.jpg\"\r\n      title=\"ADVANCED SLEEP TRACKING\"\r\n      description=\"Get a <a href=https://www.garmin.com/garmin-technology/health-science/sleep-tracking/>sleep score</a> and <a href=https://www.garmin.com/garmin-technology/health-science/sleep-coach/>personalized coaching</a> for how much sleep you need and how you can improve. Even keep track of different sleep stages and <a href=https://www.garmin.com/garmin-technology/health-science/nap-detection/>naps</a> — and see key metrics, such as <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/hrv/>HRV status</a> and skin temperature<sup>3</sup>, to better understand your health. Plus, with the sleep alignment feature, see how aligned you are to your circadian rhythm, and see your sleep consistency.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03013-00/g/77926-3-HEALTH-STATUS.jpg\"\r\n      title=\"HEALTH STATUS\"\r\n      description=\"See whether your health metrics — such as heart rate, HRV, skin temperature<sup>3</sup> and Pulse Ox<sup>1</sup> while sleeping — are trending away from your usual range, which could indicate added stress to your body. These changes could be related to physical activity levels, environment, stress, alcohol intake, potential illness and more.\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03013-00/g/77926-4-WORKOUT-OPTIONS.jpg\"\r\n      title=\"WORKOUT OPTIONS\"\r\n      description=\"Track all the ways you move with more than 80 preloaded GPS and indoor sports apps — including walking, running and more. Reach your goals with <a href=https://connect.garmin.com/features/coach/>Garmin Coach training plans</a> for running, cycling, strength and fitness; some even adapt based on your health and fitness metrics. Or get daily suggested workouts made specifically for you.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03013-00/g/77926-5-LIFESTYLE-LOGGING.jpg\"\r\n      title=\"LIFESTYLE LOGGING\"\r\n      description=\"Log custom or preset behaviors — such as caffeine and alcohol intake — and view reports on how those lifestyle choices impact your sleep, stress and HRV<sup>3</sup> in the  <a href=https://www.garmin.com/p/125677>Garmin Connect app</a>. That way, you can make more health-conscious decisions.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03013-00/g/77926-6-EVERYDAY-UTILITY.jpg\"\r\n      title=\"EVERYDAY UTILITY\"\r\n      description=\"A bright LED flashlight provides convenient illumination when you need it. Make and take phone calls from your wrist when your watch is paired to your smartphone. You can even control watch functions with voice commands — or use your smartphone’s voice assistant to respond to text messages and more.\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start headline -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-column-layout\r\n    columns=\"1\"\r\n  >\r\n    <pc-headline\r\n      data-translate\r\n      primary-text=\"SUPPORT YOUR EVERY GOAL\"\r\n      padding-top=\"3\"\r\n      padding-bottom=\"3\"\r\n      text-size=\"2.6\"\r\n      mobile-text-size=\"2.4\"\r\n      text-align=\"center\"\r\n      mobile-text-align=\"center\"\r\n      theme=\"dark\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end headline -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"HEALTH\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BodyBattery.svg\"\r\n      title=\"BODY BATTERY ENERGY MONITORING\"\r\n      description=\"See your energy levels throughout the day, so you’ll know when your body is charged up or needs to rest.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/HRV-STATUS.svg\"\r\n      title=\"HRV STATUS\"\r\n      description=\"Gain a deeper understanding of your overall health through heart rate variability while you sleep.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/30-Second-Recording.svg\"\r\n      title=\"GARMIN ECG APP\"\r\n      description=\"The <a href=https://www.garmin.com/garmin-technology/health-science/ecg/>ECG app</a><sup>4</sup> uses sensors to record the electrical signals that control how your heart beats. It analyzes that recording to detect signs of an irregular heart rhythm called atrial fibrillation  (AFIb).\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ON-DEVICE-BIKE-BELL.svg\"\r\n      title=\"SMART WAKE ALARM\"\r\n      description=\"Wake up more refreshed. The smart wake alarm gently wakes you at the optimal time.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MORNING-REPORT.svg\"\r\n      title=\"MORNING REPORT\"\r\n      description=\"Receive and customize an overview of your sleep, recovery, daily calendar, HRV status and more as soon as you wake up.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/EVENING-REPORT.svg\"\r\n      title=\"EVENING REPORT\"\r\n      description=\"Prepare for tomorrow before bed with a reminder of sleep need, tomorrow’s workout, weather and events.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/WristHeartRate.svg\"\r\n      title=\"WRIST-BASED HEART RATE\"\r\n      description=\"The watch constantly samples your heart rate, including high and low heart rate alerts<sup>3</sup> based on your specific levels.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MCT.svg\"\r\n      title=\"WOMEN’S HEALTH TRACKING\"\r\n      description=\"Track your menstrual cycle or pregnancy, plus get exercise and nutrition education. With skin temperature tracking while you sleep, get better period predictions and past ovulation estimates<sup>2</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Natural-Cycle.svg\"\r\n      title=\"NATURAL CYCLES° COMPATIBILITY\"\r\n      description=\"Unlock deeper fertility insights when you sync your skin temperature data with the FDA-cleared <a href=https://www.naturalcycles.com/devices/garmin>Natural Cycles birth control app<sup>10</sup></a> (Natural Cycles subscription required).\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/NUTRITION-IN-GARMIN-CONNECT.svg\"\r\n      title=\"NUTRITION IN THE GARMIN CONNECT<sup>™</sup> APP\"\r\n      description=\"Easily track calories and macronutrients, get personalized nutrition recommendations and see reports to follow your progress toward your goals with a <a href=https://www.garmin.com/p/1565777/>Garmin Connect+ plan</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/health-snapshot.svg\"\r\n      title=\"HEALTH SNAPSHOT\"\r\n      description=\"Log a 2-minute session to <a href='https://support.garmin.com/?faq=PB1duL5p6V64IQwhNvcRK9'>record key health stats</a>, then generate a report to share with your health care provider.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BREATHING-VARIATIONS-THROUGHOUT-THE-NIGHT.svg\"\r\n      title=\"BREATHING VARIATIONS\"\r\n      description=\"For a closer glimpse of your health, the breathing variations feature helps you understand shifts in your breathing patterns as you sleep<sup>5</sup>. These shifts could be related to environment, alcohol, or potential sleep disorders such as sleep apnea.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Meditation.svg\"\r\n      title=\"MEDITATION\"\r\n      description=\"Help reduce stress, anxiety and more with voice guided meditation practices.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/jet-lag-advisor.svg\"\r\n      title=\"JET LAG ADVISER\"\r\n      description=\"Help minimize the effects of <a href=https://www.garmin.com/garmin-technology/health-science/body-battery/>jet lag</a> with guidance on light exposure, sleep schedule and exercise.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"FITNESS\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/recovery-time.svg\"\r\n      title=\"WORKOUT BENEFIT AND RECOVERY TIME\"\r\n      description=\"Better understand how each workout affects your body and how much time you need to recover.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/TRAINING-READINESS.svg\"\r\n      title=\"TRAINING READINESS\"\r\n      description=\"Wake up and get a <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/training-readiness/>readiness score</a> based on your sleep quality, recovery and more, so you can determine whether to go hard or take it easy.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/training-status.svg\"\r\n      title=\"TRAINING STATUS\"\r\n      description=\"Get <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/training-status/>insight</a> into training effectiveness, and know whether you’re training productively, peaking or strained.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Fitness-Age.svg\"\r\n      title=\"FITNESS AGE\"\r\n      description=\"Estimate <a href=https://www.garmin.com/garmin-technology/health-science/fitness-age/>how fit you are</a> compared to your actual age.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Wheelchair-Mode.svg\"\r\n      title=\"WHEELCHAIR MODE\"\r\n      description=\"Track your daily pushes<sup>3</sup>, plus get weight shift alerts, sports apps and workouts for <a href=https://www.garmin.com/garmin-technology/health-science/wheelchair-physiology/>wheelchair users</a>, and more<sup>6</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n  < rk of Google LLC. SPOTIFY and the Spotify logo are among the registered trademarks of Spotify AB. Amazon Music and all related logos are trademarks of Amazon.com, Inc. or its affiliates.\"\r\n    />\r\n  </pc-disclaimer-block>\r\n</pc-layout-container>\r\n<!-- end disclaimer -->\r\n\r\n</div>"},"inTheBoxTab":{"title":"In the Box","content":"<ul>\r\n\t<li>Venu 4 - 41 mm</li>\r\n\t<li>Charging/data cable</li>\r\n\t<li>Documentation</li>\r\n</ul>\r\n"},"accessoriesTab":{"title":"Accessories","content":null},"specsTab":{"title":"Specs","content":"<div><table>\n        <tbody>\n        <tr class=\"title\">\n            <td colspan=\"2\" style=\"background: #fff; color: #000; border: 1px solid #ddd; border-width: 0px 0px 1px 0px; padding: 0px;\">\n                <h3>What You'll Love</h3>\n            </td>\n        </tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\"><a href='https://www.garmin.com/en-US/garmin-technology/health-science/sleep-tracking/'>Sleep score and insights</a></th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Battery life (smartwatch mode)</th><td>Up to 10 days </td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\"><a href='https://www.garmin.com/en-US/garmin-technology/health-science/pulse-ox/'>Pulse Ox blood oxygen</a></th><td>yes (spot-check, and optional all-day acclimation and in sleep)</td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Garmin ECG app</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">LED flashlight</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Garmin Pay™</th><td class=\"yes\"></td></tr><tr>\n            <th scope=\"row\" style=\"background-color: #fff; font-weight: 300;\">Multi-band GPS</th garmin on Instagram.\"\r\n  category-key=\"Venu 4\"\r\n  product-id=\"1614061\"\r\n  locale=\"en-US\"\r\n/>\r\n<!-- end social-gallery -->\r\n\r\n<!-- start line-divider -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"33\"\r\n    color=\"white\"\r\n  />\r\n</pc-layout-container>\r\n<!-- end line-divider -->\r\n\r\n<!-- start life-style -->\r\n<pc-life-style\r\n  data-translate\r\n  bg-image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-Family-D.jpg\"\r\n  mobile-bg-image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-Family-M.jpg\"\r\n  theme=\"dark\"\r\n/>\r\n<!-- end life-style -->\r\n\r\n<!-- start overview-intro -->\r\n<pc-overview-intro\r\n  data-translate\r\n  title=\"DISCOVER A HEALTHIER YOU\"\r\n  title-heading=\"h2\"\r\n  title-align=\"center\"\r\n  description=\"Purpose-built with advanced health and fitness features, the Venu 4 smartwatch is your on-wrist support to help you better understand your body and make healthier decisions.\"\r\n  description-size=\"large\"\r\n  description-align=\"center\"\r\n  theme=\"light\"\r\n>\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/AMOLED_Display.svg\"\r\n    img-width=\"50px\"\r\n    description=\"BRIGHT, COLORFUL 1.4-INCH AMOLED DISPLAY\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Battery_Life.svg\"\r\n    img-width=\"50px\"\r\n    description=\"UP TO 12 DAYS OF BATTERY LIFE IN SMARTWATCH MODE\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Health-And-Fitness-Monitoring.svg\"\r\n    img-width=\"50px\"\r\n    description=\"ADVANCED HEALTH AND FITNESS FEATURES\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/LIGHTWEIGHT-2.svg\"\r\n    img-width=\"50px\"\r\n    description=\"LIGHTWEIGHT 45 MM CASE WITH  METAL DESIGN\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/Garmin_Connect.svg\"\r\n    img-width=\"50px\"\r\n    description=\"WORKS WITH THE GARMIN CONNECT<sup>™</sup> APP ON iPHONE<sup>®</sup> AND ANDROID<sup>™</sup> SMARTPHONES\"\r\n  />\r\n  <pc-feature-card\r\n    data-translate\r\n    image=\"https://res.garmin.com/icons/FLASHLIGHT.svg\"\r\n    img-width=\"50px\"\r\n    description=\"BRIGHT LED FLASHLIGHT\"\r\n  />\r\n</pc-overview-intro>\r\n<!-- end overview-intro -->\r\n\r\n</div><div><!-- start headline -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-column-layout\r\n    columns=\"1\"\r\n  >\r\n    <pc-headline\r\n      data-translate\r\n      primary-text=\"WHAT YOU'LL LOVE\"\r\n      padding-top=\"3\"\r\n      padding-bottom=\"3\"\r\n      text-size=\"2.6\"\r\n      mobile-text-size=\"2.4\"\r\n      text-align=\"center\"\r\n      mobile-text-align=\"center\"\r\n      theme=\"dark\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end headline -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-1-HEALTH-MONITORING.jpg\"\r\n      title=\"24/7 HEALTH MONITORING\"\r\n      description=\"Make improvements toward a healthier lifestyle with extensive health monitoring features, such as <a href=https://www.garmin.com/garmin-technology/health-science/body-battery/>Body Battery<sup>™</sup> energy monitoring</a>, <a href=https://www.garmin.com/garmin-technology/health-science/stress-tracking/>stress</a>, <a href=https://www.garmin.com/garmin-technology/health-science/pulse-ox/>Pulse Ox</a><sup>1</sup> and <a href=https://www.garmin.com/garmin-technology/health-science/womens-health/>women’s health tracking</a> — including past ovulation estimates<sup>2</sup>   — and more<sup>3</sup>.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-2-SLEEP-TRACKING.jpg\"\r\n      title=\"ADVANCED SLEEP TRACKING\"\r\n      description=\"Get a <a href=https://www.garmin.com/garmin-technology/health-science/sleep-tracking/>sleep score</a> and <a href=https://www.garmin.com/garmin-technology/health-science/sleep-coach/>personalized coaching</a> for how much sleep you need and how you can improve. Even keep track of different sleep stages and <a href=https://www.garmin.com/garmin-technology/health-science/nap-detection/>naps</a> — and see key metrics, such as <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/hrv/>HRV status</a> and skin temperature<sup>3</sup>, to better understand your health. Plus, with the sleep alignment feature, see how aligned you are to your circadian rhythm and see your sleep consistency.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-3-HEALTH-STATUS.jpg\"\r\n      title=\"HEALTH STATUS\"\r\n      description=\"See whether your health metrics — such as heart rate, HRV, skin temperature<sup>3</sup> and Pulse Ox<sup>1</sup> while sleeping — are trending away from your usual range, which could indicate added stress to your body. These changes could be related to physical activity levels, environment, stress, alcohol intake, potential illness, and more.\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout>\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-4-WORKOUT-OPTIONS.jpg\"\r\n      title=\"WORKOUT OPTIONS\"\r\n      description=\"Track all the ways you move with more than 80 preloaded GPS and indoor sports apps — including walking, running and more. Reach your goals with <a href=https://connect.garmin.com/features/coach/>Garmin Coach</a> training plans for running, cycling, strength and fitness; some even adapt based on your health and fitness metrics. Or get daily suggested workouts made specifically for you.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-5-LIFESTYLE-LOGGING.jpg\"\r\n      title=\"LIFESTYLE LOGGING\"\r\n      description=\"Log custom or preset behaviors — such as caffeine and alcohol intake — and view reports on how those lifestyle choices impact your sleep, stress and HRV<sup>3</sup> in the <a href=https://www.garmin.com/p/125677>Garmin Connect app</a>. That way, you can make more health-conscious decisions.\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/en/products/010-03014-00/g/77928-6-EVERYDAY-UTILITY.jpg\"\r\n      title=\"EVERYDAY UTILITY\"\r\n      description=\"A bright LED flashlight provides convenient illumination when you need it. Make and take phone calls from your wrist when your watch is paired to your smartphone. You can even control watch functions with voice commands — or use your smartphone’s voice assistant to respond to text messages and more.\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start headline -->\r\n<pc-layout-container\r\n  theme=\"light\"\r\n>\r\n  <pc-column-layout\r\n    columns=\"1\"\r\n  >\r\n    <pc-headline\r\n      data-translate\r\n      primary-text=\"SUPPORT YOUR EVERY GOAL\"\r\n      padding-top=\"3\"\r\n      padding-bottom=\"3\"\r\n      text-size=\"2.6\"\r\n      mobile-text-size=\"2.4\"\r\n      text-align=\"center\"\r\n      mobile-text-align=\"center\"\r\n      theme=\"dark\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end headline -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"HEALTH\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BodyBattery.svg\"\r\n      title=\"BODY BATTERY ENERGY MONITORING\"\r\n      description=\"See your energy levels throughout the day, so you’ll know when your body is charged up or needs to rest.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/HRV-STATUS.svg\"\r\n      title=\"HRV STATUS\"\r\n      description=\"Gain a deeper understanding of your overall health through heart rate variability while you sleep.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/30-Second-Recording.svg\"\r\n      title=\"GARMIN ECG APP\"\r\n      description=\"The <a href=https://www.garmin.com/garmin-technology/health-science/ecg/>ECG app</a><sup>4</sup> uses sensors to record the electrical signals that control how your heart beats. It analyzes that recording to detect signs of an irregular heart rhythm called atrial fibrillation  (AFIb).\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ON-DEVICE-BIKE-BELL.svg\"\r\n      title=\"SMART WAKE ALARM\"\r\n      description=\"Wake up more refreshed. The smart wake alarm gently wakes you at the optimal time.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MORNING-REPORT.svg\"\r\n      title=\"MORNING REPORT\"\r\n      description=\"Receive and customize an overview of your sleep, recovery, daily calendar, HRV status and more as soon as you wake up.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/EVENING-REPORT.svg\"\r\n      title=\"EVENING REPORT\"\r\n      description=\"Prepare for tomorrow before bed with a reminder of sleep need, tomorrow’s workout, weather and events.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/WristHeartRate.svg\"\r\n      title=\"WRIST-BASED HEART RATE\"\r\n      description=\"The watch constantly samples your heart rate, including high and low heart rate alerts<sup>3</sup> based on your specific levels.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MCT.svg\"\r\n      title=\"WOMEN’S HEALTH TRACKING\"\r\n      description=\"Track your menstrual cycle or pregnancy, plus get exercise and nutrition education. With skin temperature tracking while you sleep, get better period predictions and past ovulation estimates<sup>2</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/NUTRITION-IN-GARMIN-CONNECT.svg\"\r\n      title=\"NUTRITION IN THE GARMIN CONNECT<sup>™</sup> APP\"\r\n      description=\"Easily track calories and macronutrients, get personalized nutrition recommendations and see reports to follow your progress toward your goals with a <a href=https://www.garmin.com/p/1565777/>Garmin Connect+ plan</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/health-snapshot.svg\"\r\n      title=\"HEALTH SNAPSHOT\"\r\n      description=\"Log a 2-minute session to <a href='https://support.garmin.com/?faq=PB1duL5p6V64IQwhNvcRK9'>record key health stats</a>, then generate a report to share with your health care provider.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/BREATHING-VARIATIONS-THROUGHOUT-THE-NIGHT.svg\"\r\n      title=\"BREATHING VARIATIONS\"\r\n      description=\"For a closer glimpse of your health, the breathing variations feature helps you understand shifts in your breathing patterns as you sleep<sup>5</sup>. These shifts could be related to environment, alcohol or potential sleep disorders such as sleep apnea.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Meditation.svg\"\r\n      title=\"MEDITATION\"\r\n      description=\"Help reduce stress, anxiety and more with voice-guided meditation practices.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/jet-lag-advisor.svg\"\r\n      title=\"JET LAG ADVISER\"\r\n      description=\"Help minimize the effects of <a href=https://www.garmin.com/garmin-technology/health-science/body-battery/>jet lag</a> with guidance on light exposure, sleep schedule and exercise.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"FITNESS\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/recovery-time.svg\"\r\n      title=\"WORKOUT BENEFIT AND RECOVERY TIME\"\r\n      description=\"Better understand how each workout affects your body and how much time you need to recover.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/TRAINING-READINESS.svg\"\r\n      title=\"TRAINING READINESS\"\r\n      description=\"Wake up and get a <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/training-readiness/>readiness score</a> based on your sleep quality, recovery and more, so you can determine whether to go hard or take it easy.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/training-status.svg\"\r\n      title=\"TRAINING STATUS\"\r\n      description=\"Get <a href=https://www.garmin.com/garmin-technology/running-science/physiological-measurements/training-status/>insight</a> into training effectiveness, and know whether you’re training productively, peaking or strained.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Fitness-Age.svg\"\r\n      title=\"FITNESS AGE\"\r\n      description=\"Estimate <a href=https://www.garmin.com/garmin-technology/health-science/fitness-age/>how fit you are</a> compared to your actual age.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Wheelchair-Mode.svg\"\r\n      title=\"WHEELCHAIR MODE\"\r\n      description=\"Track your daily pushes<sup>3</sup>, plus get weight shift alerts, sports apps and workouts for <a href=https://www.garmin.com/garmin-technology/health-science/wheelchair-physiology/>wheelchair users</a>, and more<sup>6</sup>.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/strength-training.svg\"\r\n      title=\"STRENGTH TRAINING\"\r\n      description=\"Elevate your performance with a built-in activity profile, targeted strength training plans, workouts and more. You can also track reps, sets and even rest time.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Workout-Creation.svg\"\r\n      title=\"WORKOUT CREATION\"\r\n      description=\"Create step-by-step workouts from more than 1,600 exercises in the Garmin Connect app, and send them directly to your watch.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/On-screen_workouts.svg\"\r\n      title=\"ANIMATED ON-SCREEN WORKOUTS\"\r\n      description=\"Improve your form with downloadable animated workouts from Garmin Connect for HIIT, cardio, strength, yoga , mobility and Pilates.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/HIIT-WORKOUTS.svg\"\r\n      title=\"MIXED SESSION\"\r\n      description=\"Track multiple activities in one session. Just choose one activity, press stop, then move to the next.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/ski.svg\"\r\n      title=\"XC SKI INDOOR ACTIVITY\"\r\n      description=\"Whether you’re preparing for a race or doing functional training, track your indoor ski sessions with this activity profile, which includes support for compatible indoor ski trainers.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Practice-Mode.svg\"\r\n      title=\"GOLF ACTVITY\"\r\n      description=\"Get distance to the front/middle/back of the green, layups, hazards and more for 43,000+ courses. Add a <a href=https://www.garmin.com/p/850633>Garmin Golf<sup>™</sup> membership</a> for premium CourseView maps with touch targeting, the Playslike Distance feature and green contours.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Workout-Recommendations-Cycling.svg\"\r\n      title=\"SEE YOUR CYCLING DATA\"\r\n      description=\"Connect with compatible cycling products, including Rally<sup>™</sup> power meter pedals, to monitor performance and ride smarter, plus get haptic and voice alerts for approaching vehicles and more when paired with a Varia<sup>™</sup> rearview radar.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"RUNNING AND TRIATHLON\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/MultiBand.svg\"\r\n      title=\"MULTI-BAND GPS\"\r\n      description=\"Get superior positioning accuracy and optimized battery life with SatIQ<sup>™</sup> technology.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/wrist-based-running-dynamics.svg\"\r\n      title=\"WRIST-BASED RUNNING DYNAMICS\"\r\n      description=\"View crucial running metrics such as cadence, stride length, ground contact time and more  to help improve your running form.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/WRIST-BASED-RUNNING-POWER.svg\"\r\n      title=\"WRIST-BASED RUNNING POWER\"\r\n      description=\"See how much power you’re applying during your run so you can manage effort and fine-tune your training.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/COURSE-PLANNER.svg\"\r\n      title=\"COURSES\"\r\n      description=\"Create or find existing courses in the Garmin Connect smartphone app, or sync from your favorite third-party platforms.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/track-running.svg\"\r\n      title=\"TRACK RUNNING\"\r\n      description=\"Your watch will record accurate lap distances in meters on tracks all over the world.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Dynamic_PacePro.svg\"\r\n      title=\"PACEPRO<sup>™</sup> PACING STRATEGIES\"\r\n      description=\"Plan <a href=https://www.garmin.com/garmin-technology/wearable-maps/pacepro/>race-day strategy</a> with GPS-based pace guidance for a selected course or distance.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/LIFESTYLE.svg\"\r\n      title=\"TRIATHLON AND MULTISPORT\"\r\n      description=\"Automatically record splits with built-in profiles for triathlons, duathlons, brick workouts and swimruns. Or you can create your own.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/advanced-swim-metrics.svg\"\r\n      title=\"ADVANCED SWIM METRICS\"\r\n      description=\"Swim smarter with metrics like swolf to track efficiency, stroke type, pace and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/QUICK-WORKOUT.svg\"\r\n      title=\"QUICK WORKOUT\"\r\n      description=\"Simplify training with running workout suggestions tailored to your fitness level. Just input your desired time and intensity level.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/RUCKING-ACTIVITY.svg\"\r\n      title=\"RUCKING ACTIVITY\"\r\n      description=\"A dedicated rucking activity profile allows you to enter pack weight.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"CONNECT\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Garmin_Connect.svg\"\r\n      title=\"GARMIN CONNECT APP\"\r\n      description=\"See your health and fitness information, connect with friends and more.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/CONNECT-IQ-STORE.svg\"\r\n      title=\"CONNECT IQ<sup>™</sup> STORE\"\r\n      description=\"<a href=https://www.garmin.com/p/616398>Add watch faces, data fields and apps</a> to your paired watch.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Messaging.svg\"\r\n      title=\"SMART NOTIFICATIONS\"\r\n      description=\"Receive emails, texts and alerts on your watch when paired with your iPhone or Android smartphone.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/On-Wrist-Texting.svg\"\r\n      title=\"ON-WRIST TEXTING\"\r\n      description=\"Use the keyboard to send quick text responses on your paired watch (Android only or through the Garmin Messenger<sup>™</sup> app<sup>7</sup>) so you can keep your phone in your pocket.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Voice-Assistant.svg\"\r\n      title=\"HANDS-FREE VOICE CONTROL\"\r\n      description=\"Say “<a href='https://support.garmin.com/en-US/?faq=KLYra4C7BE4RYCyMgBbWp6'>OK, Garmin</a>” to start a timer on your smartwatch, start an activity, turn on your flashlight and more. Or say “phone assistant” to access your paired smartphone’s virtual assistant.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/WhatsApp.svg\"\r\n      title=\"WORKS WITH WHATSAPP\"\r\n      description=\"Stay up to date on WhatsApp while keeping your phone in your pocket. Read, reply and react to your messages right from your watch<sup>9</sup>. The app is available in the <a href=https://www.garmin.com/p/616398/>Connect IQ Store</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/VIEW-PHOTO-FROM-WATCH.svg\"\r\n      title=\"VIEW PHOTOS\"\r\n      description=\"With an Android phone, view photos sent to you directly from your watch’s screen.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Music.svg\"\r\n      title=\"MUSIC\"\r\n      description=\"Download songs and playlists from your Spotify, Deezer, Amazon Music or YouTube<sup>®</sup> Music accounts for phone-free listening (subscription may be required).\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Garmin_Pay.svg\"\r\n      title=\"GARMIN PAY<sup>™</sup>CONTACTLESS PAYMENTS\"\r\n      description=\"Breeze through checkout lines or transit systems with <a href=https://www.garmin.com/garminpay/banks/>participating providers</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/assistance.svg\"\r\n      title=\"SAFETY AND TRACKING\"\r\n      description=\"Your device will send a message<sup>8</sup> with your live location to preset assistance contacts if a fall is detected. Get peace of mind with all-day monitoring or enable detection for only the activities you specify.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/waze.svg\"\r\n      title=\"YOUR LIVE LOCATION IN WAZE\"\r\n      description=\"Drivers using Waze can get alerts for nearby cyclists via <a href=https://www.garmin.com/garmin-technology/cycling-science/>LiveTrack<sup>™</sup> location sharing</a>.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/TrackShareLocation.svg\"\r\n      title=\"ASSISTANCE\"\r\n      description=\"<a href=https://www.garmin.com/blog/fitness/how-garmin-helps-you-run-safely/>If you need assistance</a>, you can manually send a message<sup>8</sup> with your live location to your preloaded contacts.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/sports-score.svg\"\r\n      title=\"SPORTS SCORES\"\r\n      description=\"Live data, schedules and standings for 15 different sports leagues when paired to your smartphone.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Share.svg\"\r\n      title=\"GARMIN SHARE\"\r\n      description=\"Easily share saved locations, courses and workouts with friends’ compatible Garmin devices.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Google-Maps.svg\"\r\n      title=\"GOOGLE MAPS<sup>™</sup> APP\"\r\n      description=\"Know where to go when walking, running or cycling. Enter your destination in Google Maps on your Android<sup>™</sup> smartphone, then follow turn-by-turn directions on your wrist.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start product-feature -->\r\n<pc-layout-container>\r\n  <pc-copy\r\n    data-translate\r\n    title=\"CONVENIENCE\"\r\n    title-heading-size=\"h2\"\r\n    title-align=\"left\"\r\n    theme=\"light\"\r\n  />\r\n  <pc-line-divider\r\n    height=\"1\"\r\n    width=\"100\"\r\n    color=\"#000\"\r\n    style=\"margin-top:-1rem;margin-bottom:2rem;\"\r\n  />\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/WATCH-FACE-EDITOR.svg\"\r\n      title=\"WATCH FACE CUSTOMIZATION\"\r\n      description=\"Choose from various watch faces with customizable data   and colors. Even hear the data fields spoken from the watch face.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Two-Font-Sizes.svg\"\r\n      title=\"FONT SIZES\"\r\n      description=\"Change text size for easy readability.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Night-Vision.svg\"\r\n      title=\"COLOR SHIFT\"\r\n      description=\"Change the watch display to shades of red, green or orange — or even use the blue light filter — to preserve your night vision and reduce sleep cycle disturbances.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Always-On-Display.svg\"\r\n      title=\"COLOR FILTERS\"\r\n      description=\"Get color display options — including gray scale, red/green, green/red or blue/yellow — to assist with various forms of color blindness.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/Real-time.svg\"\r\n      title=\"TIMER AND STOPWATCH\"\r\n      description=\"We didn’t forget about the practical features you need for everyday life.\"\r\n      content-align=\"center\"\r\n    />\r\n  </pc-column-layout>\r\n  <pc-column-layout\r\n    columns=\"5\"\r\n    columns-on-mobile=\"2\"\r\n  >\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/FOCUS-MODES.svg\"\r\n      title=\"FOCUS MODES\"\r\n      description=\"Automatically silence notifications and distractions during sleep or activities. Plus, customize modes to fit your needs.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card\r\n      data-translate\r\n      image=\"https://res.garmin.com/icons/CALENDAR-VIEW.svg\"\r\n      title=\"CALENDAR\"\r\n      description=\"See upcoming appointments and meetings from your paired smartphone’s calendar.\"\r\n      content-align=\"center\"\r\n    />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n    <pc-feature-card />\r\n  </pc-column-layout>\r\n</pc-layout-container>\r\n<!-- end product-feature -->\r\n\r\n<!-- start disclaimer -->\r\n<pc-layout-container\r\n  theme=\"neutral\"\r\n>\r\n  <pc-disclaimer-block>\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"1\"\r\n      content=\"This is not a medical device and is not intended for use in the diagnosis or monitoring of any medical condition; see <a href=https://www.garmin.com/legal/atdisclaimer/>Garmin.com/ataccuracy</a>. Pulse Ox not available in all countries.\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"2\"\r\n      content=\"The menstrual cycle tracking feature should not be used in support of conception, contraception or birth control. This is not a medical device and is not intended for use in the diagnosis or monitoring of any medical condition.\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"3\"\r\n      content=\"<a href=https://www.garmin.com/legal/atdisclaimer/>Activity tracking accuracy</a>\"\r\n    />\r\n    <pc-disclaimer-item\r\n      data-translate\r\n      counter=\"4\"\r\n      content=\"The ECG app is only available on select Garmin smartwatches with the latest version of the Garmin Connect smartphone app and watch software. The ECG app is not available in all regions; see <a href=https://www.garmin.com/garmin-technology/health-science/ecg/>Garmin.com/ECG</a> for availability. The ECG app is only intended for adults aged 22 years and over. The ECG app is capable of recording an ECG simi
