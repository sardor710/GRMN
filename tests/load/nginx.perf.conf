# Task 21B perf proxy: TLS termination in front of the Next.js standalone server, as in production
# (Section 11). PERF ONLY: the trusted client address is taken from the load generator's synthetic
# x-perf-client header so that each virtual shopper has its own rate-limit bucket. A production proxy
# must set x-grmn-client-ip from $remote_addr and drop any client-supplied value.
worker_processes 1;
events { worker_connections 4096; }
http {
  access_log off;
  upstream app { server app:3000; keepalive 64; }
  map $http_x_perf_client $grmn_client_ip { default $http_x_perf_client; "" $remote_addr; }
  server {
    listen 443 ssl;
    server_name grmn.perf.internal;
    ssl_certificate /etc/nginx/certs/perf.crt;
    ssl_certificate_key /etc/nginx/certs/perf.key;
    client_max_body_size 2m;
    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header x-grmn-client-ip $grmn_client_ip;
      proxy_set_header x-perf-client "";
      proxy_read_timeout 60s;
      proxy_pass http://app;
    }
  }
}
